<script>
const swapButton=document.getElementById('swap');
let swapping=false;
swapButton.addEventListener('click',()=>{});
/* v11.35 microphone speech workflow is installed after composer initialization. */

// Sensor preview only. No changes to swap animation or participant panels.
(()=>{
const sheet=document.getElementById('sensorSheet');
const toggle=document.getElementById('sensorToggle');
const status=document.getElementById('sensorStatus');
const x=document.getElementById('sensorX'),y=document.getElementById('sensorY');
let enabled=false,seen=false,raf=0,latest=null,startedAt=0;
const onOrientation=e=>{
 if(!enabled || !Number.isFinite(e.gamma) || !Number.isFinite(e.beta))return;
 latest={gamma:e.gamma,beta:e.beta};seen=true;
 // Sensor-controlled reflections: update CSS only, preserving the existing mic motion.
 const root=document.getElementById('app');
 root.style.setProperty('--shine-x',(50+Math.max(-35,Math.min(35,e.gamma*.7))).toFixed(1)+'%');
 root.style.setProperty('--shine-y',(40+Math.max(-30,Math.min(30,(e.beta-45)*.45))).toFixed(1)+'%');
 root.style.setProperty('--shine-strength','.85');
 root.style.setProperty('--message-upright',Math.max(-80,Math.min(80,-e.gamma)).toFixed(1)+'deg');
 const gold=document.getElementById('avnivoGold');if(gold)gold.setAttribute('gradientTransform','translate('+(Math.max(-.36,Math.min(.36,e.gamma/125))).toFixed(3)+' 0)');
 // Counter-rotate the glyph, not the tappable button. Gamma is the portrait roll approximation.
 const roll=Math.max(-80,Math.min(80,-e.gamma));
 const pitch=Math.max(-10,Math.min(10,(e.beta-45)*0.12));
 document.getElementById('mic').style.transform='rotate('+roll.toFixed(1)+'deg)';
 status.textContent='v8.7 | Mikrofon burilishi: '+roll.toFixed(1)+'°';
 if(!raf)raf=requestAnimationFrame(()=>{
  raf=0;if(!enabled||!latest)return;
  x.textContent=latest.gamma.toFixed(1)+'°';y.textContent=latest.beta.toFixed(1)+'°';
  status.textContent='v8.7 | Mikrofon burilishi: '+Math.max(-80,Math.min(80,-latest.gamma)).toFixed(1)+'°';
 });
};
function stop(){const root=document.getElementById('app');for(const key of ['--shine-x','--shine-y','--shine-strength','--message-upright'])root.style.removeProperty(key);const gold=document.getElementById('avnivoGold');if(gold)gold.removeAttribute('gradientTransform');enabled=false;document.getElementById('mic').style.removeProperty('transform');window.removeEventListener('deviceorientation',onOrientation);if(raf)cancelAnimationFrame(raf);raf=0;toggle.textContent='Sensorni yoqish';status.textContent='Sensor o‘chirilgan';x.textContent='—';y.textContent='—'}
document.getElementById('settingsBtn').addEventListener('click',()=>{sheet.hidden=false;toggle.focus()});
document.getElementById('sensorClose').addEventListener('click',()=>{sheet.hidden=true});
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});
toggle.addEventListener('click',async()=>{
 if(enabled){stop();return}
 if(!window.isSecureContext){status.textContent='Sensor uchun HTTPS talab qilinishi mumkin. Faylni xavfsiz manzilda oching.';return}
 if(typeof DeviceOrientationEvent==='undefined'){status.textContent='Brauzer ushbu sensor API sini qo‘llamaydi.';return}
 try{
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
   const result=await DeviceOrientationEvent.requestPermission();
   if(result!=='granted'){status.textContent='Sensor ruxsati berilmadi.';return}
  }
  enabled=true;seen=false;startedAt=Date.now();toggle.textContent='Sensorni o‘chirish';status.textContent='Sensor ma’lumotlari kutilmoqda…';
  // Close the opaque sensor dialog so the microphone is actually visible during the test.
  sheet.hidden=true;
  window.addEventListener('deviceorientation',onOrientation,{passive:true});
  setTimeout(()=>{if(enabled&&!seen&&Date.now()-startedAt>=2000)status.textContent='Ma’lumot kelmadi. Brauzer yoki telefon sensorni cheklayotgan bo‘lishi mumkin.'},2500);
 }catch(err){status.textContent='Sensorni ishga tushirib bo‘lmadi: '+(err?.message||'ruxsat xatosi')}
});
})();
</script>

/* Make the entire language badge tappable on Android Chrome, including while editing. */
 const languageTapStyle=document.createElement('style');
 languageTapStyle.textContent='.speaker .speaker-language-title{position:relative;z-index:25;pointer-events:auto;cursor:pointer;touch-action:manipulation}.speaker .speaker-language-title select{pointer-events:auto;min-height:36px;cursor:pointer}.app.is-editing .speaker:not(.is-editor) .speaker-language-title,.app.is-editing .speaker:not(.is-editor) .speaker-language-title select{pointer-events:auto}';
 document.head.appendChild(languageTapStyle);
 /* Online language selection: both panels, reciprocal names, persisted choice. */
(()=>{
 const upper=document.getElementById('upperLanguageSelect');
 const lower=document.getElementById('bottomLanguageSelect');
 const upperTranslated=document.getElementById('upperLanguageUz');
 const lowerTranslated=document.getElementById('bottomLanguageTranslation');
 if(!upper||!lower||!upperTranslated||!lowerTranslated)return;
 const native={uz:'O‘zbek tili',ru:'Русский язык',en:'English',tr:'Türkçe'};
 // The original four language choices use short codes. Keep those exact
 // values so existing translation, TTS and saved selections continue to work.
 // Suppress their full BCP-47 aliases in the visible picker only; the STT
 // resolver maps the short codes to the correct Chirp 2 locale.
 const aliases=new Set(['uz-UZ','ru-RU','en-US','tr-TR']);
 for(const [code,label] of (window.CHIRP2_MATRIX||[])){
   if(!aliases.has(code))native[code]=label;
 }
 const names={
  uz:{uz:'O‘zbek tili',ru:'Узбекский язык',en:'Uzbek language',tr:'Özbekçe'},
  ru:{uz:'Rus tili',ru:'Русский язык',en:'Russian language',tr:'Rusça'},
  en:{uz:'Ingliz tili',ru:'Английский язык',en:'English',tr:'İngilizce'},
  tr:{uz:'Turk tili',ru:'Турецкий язык',en:'Turkish language',tr:'Türkçe'}
 };
 const supported=Object.keys(native);
 for(const select of [upper,lower]){
   for(const [code,label] of (window.CHIRP2_MATRIX||[])){
     if(aliases.has(code))continue;
     const option=document.createElement('option');option.value=code;option.textContent=label+' — '+code;select.append(option);
   }
 }
 try{
  const a=localStorage.getItem('avnivo.online.upper'),b=localStorage.getItem('avnivo.online.lower');
  if(supported.includes(a))upper.value=a;
  if(supported.includes(b))lower.value=b;
 }catch(_){}
 function apply(){
  upperTranslated.textContent=names[upper.value]?.[lower.value]||native[upper.value];
  lowerTranslated.textContent=names[lower.value]?.[upper.value]||native[lower.value];
  const topLang=document.getElementById('topLang');
  if(topLang)topLang.textContent=names[upper.value]?.uz||native[upper.value];
  try{localStorage.setItem('avnivo.online.upper',upper.value);localStorage.setItem('avnivo.online.lower',lower.value)}catch(_){}
 }
 // Custom picker: native select.showPicker() is inconsistent in embedded mobile browsers.

 // document-level modal so stacking contexts and pointer-event rules cannot hide it.

<script>
/* v11.30: persistent incoming/outgoing chat messages and draft clearing. */
(()=>{
 const app=document.getElementById('app');
 const viewport=window.visualViewport;
 const speakers=[...app.querySelectorAll('.speaker')];
 const SLIDE_MS=1450;
 const buttons=speakers.map(s=>s.querySelector('.message-button'));
 let active=null,typingToken=0,keyboardTimer=0;
 const baseline=window.innerHeight;
 function resize(){
   if(!viewport)return;
   const h=Math.max(250,Math.round(viewport.height));
   const keyboard=h<Math.min(baseline,window.innerHeight)-110;
   app.classList.toggle('keyboard-open',keyboard);
   // Position fixed app relative to the visible viewport, including browser pan.
   app.style.height=h+'px';
   app.style.top=Math.max(0,Math.round(viewport.offsetTop))+'px';
 }
 if(viewport){
   viewport.addEventListener('resize',resize,{passive:true});
   viewport.addEventListener('scroll',resize,{passive:true});
 }
 function grow(input){
   input.style.height='24px';
   const cap=Math.max(38,Math.min((viewport?.height||window.innerHeight)*.19,130));
   input.style.height=Math.min(input.scrollHeight,cap)+'px';
 }
 function open(speaker,focus=true){
   const wasOpen=speaker.querySelector('.center').classList.contains('is-composing');
   const moving=speaker.querySelector('.message-button');
   const from=wasOpen?null:moving.getBoundingClientRect();
   const center=speaker.querySelector('.center');
   const compose=center.querySelector('.message-compose');
   const button=center.querySelector('.message-button');
   compose.hidden=false;
   center.classList.add('is-composing');
   button.setAttribute('aria-expanded','true');
   if(from){
     const to=moving.getBoundingClientRect();
     const dx=from.left-to.left,dy=from.top-to.top;
     if(Math.abs(dx)+Math.abs(dy)>1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
       // FLIP: animate the actual icon's old position to its new left-aligned position.
       moving.animate([{translate:dx+'px '+dy+'px'},{translate:'0px 0px'}],{duration:SLIDE_MS,easing:'cubic-bezier(.22,.61,.36,1)'});
     }
   }
   if(focus){const input=speaker.querySelector('.message-input');input.focus({preventScroll:true});grow(input);resize();}
 }
 function lock(speaker){
   active=speaker;app.classList.add('is-editing');
   speakers.forEach(s=>s.classList.toggle('is-editor',s===speaker));
 }
 buttons.forEach(button=>{
   const speaker=button.closest('.speaker');
   const input=speaker.querySelector('.message-input');

   button.addEventListener('click',()=>{
     // Only the panel currently at the bottom may accept manual text.
     if(!speaker.classList.contains('middle'))return;
     // A stale editor lock must never block the currently visible lower panel.
     if(active&&active!==speaker){active=null;app.classList.remove('is-editing');speakers.forEach(p=>p.classList.remove('is-editor'));}
     button.classList.remove('is-shaking');void button.offsetWidth;button.classList.add('is-shaking');
     setTimeout(()=>button.classList.remove('is-shaking'),400);
     // Only the tapped speaker opens; the other icon stays exactly in place.
     open(speaker,false);
     lock(speaker);
     // Focus must occur inside the trusted tap event for Android to show its keyboard.
     input.focus({preventScroll:true});
     grow(input);
     resize();
   });
   // The visible text box is itself the tap target, even during demo translation.
   const bubble=speaker.querySelector('.message-bubble');
   bubble.addEventListener('click',()=>{
     if(!speaker.classList.contains('middle'))return;
     if(active&&active!==speaker){active=null;app.classList.remove('is-editing');speakers.forEach(p=>p.classList.remove('is-editor'));}
     open(speaker,false);
     lock(speaker);
     if(input.readOnly)input.readOnly=false;
     input.focus({preventScroll:true});
   });
   input.addEventListener('focus',()=>{
     if(!speaker.classList.contains('middle')){input.blur();return;}
     lock(speaker);
   });
   input.addEventListener('input',()=>grow(input));
 });
 function beforeSwap(){
   // Prepare the text at the very start of the swap, without changing the UI.
   const speaking=app.querySelector('.speaker.middle');
   const original=speaking?.querySelector('.message-input')?.value.trim()||'';
   if(original){
     const detail=window.avnivoPrepareSpeech?.(original,speaking.dataset.speaker)||
       {originalText:original,preparedText:original,sourceLanguage:'unknown'};
     window.dispatchEvent(new CustomEvent('avnivo:speech-prepared',{detail}));
   }

   active=null;app.classList.remove('is-editing');
   speakers.forEach(s=>s.classList.remove('is-editor','is-translating'));

   app.classList.remove('keyboard-open');
   app.style.height='';
   app.style.top='';
 }
 async function afterSwap(nowTop,nowBottom){
   // The authored message stays with its speaker, now at the top.
   const input=nowTop.querySelector('.message-input');
   const source=input.value.trim();
   // Always clear the draft when its speaker changes position.
   input.value='';
   grow(input);
   // The other speaker is now the bottom editor. Reveal without focusing:
   // keyboard must open only after a user taps its text field.
   open(nowBottom,false);
   if(!source)return;
   const language=document.getElementById('upperLanguageSelect')?.value||'ru';
   const shortNames={ru:'РУ:',en:'EN:',tr:'TR:',uz:'UZ:'};
   function appendMessage(speaker,side,label,message){
     const history=speaker.querySelector('.translation-history');
     const line=document.createElement('div');
     line.className='translation-line '+side;
     const prefix=document.createElement('span');
     prefix.className='translation-prefix';
     prefix.textContent=label;
     const body=document.createElement('span');
     body.className='translation-body';
     body.textContent=message;
     line.append(prefix,body);
     history.append(line);
     history.scrollTop=history.scrollHeight;
     return {history,body};
   }
   const sourceLabel=(window.avnivoOnlineLanguageForSpeaker?.(nowTop.dataset.speaker)||'uz').toUpperCase()+':';
   appendMessage(nowTop,'outgoing',sourceLabel,source);
   const avnivoTurn={speaker:nowTop.dataset.speaker,source,sourceLang:window.avnivoOnlineLanguageForSpeaker?.(nowTop.dataset.speaker)||'uz',targetLang:window.avnivoOnlineLanguageForSpeaker?.(nowBottom.dataset.speaker)||'ru',translation:'',at:Date.now()};
   window.dispatchEvent(new CustomEvent('avnivo:history-turn',{detail:{...avnivoTurn}}));
   const destLabel=(window.avnivoOnlineLanguageForSpeaker?.(nowBottom.dataset.speaker)||'ru').toUpperCase()+':';
   const target=appendMessage(nowBottom,'incoming',destLabel,'');
   // Real Google Translation LLM; no fabricated demo translation or silent fallback.
   const token=++typingToken;
   const sourceLang=window.avnivoOnlineLanguageForSpeaker?.(nowTop.dataset.speaker)||'uz';
   const targetLang=window.avnivoOnlineLanguageForSpeaker?.(nowBottom.dataset.speaker)||'ru';
   if(sourceLang===targetLang){
     target.body.textContent=source;
     window.dispatchEvent(new CustomEvent('avnivo:history-translation',{detail:{at:avnivoTurn.at,translation:source}}));
     return;
   }
   nowBottom.classList.add('is-translating');
   target.body.textContent='Tarjima qilinmoqda…';
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),30000);
   try{
     const response=await fetch('https://avnivo-translation-test-792624108019.europe-west1.run.app/api/translate',{
       method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({text:source,source:sourceLang,target:targetLang}),
       signal:controller.signal
     });
     const data=await response.json().catch(()=>({}));
     if(token!==typingToken)return;
     if(!response.ok||typeof data.text!=='string'||!data.text.trim()){
       throw new Error(response.status===429?'So‘rovlar chegarasi oshdi':response.status===503?'Tarjima xizmati sozlanmagan':('HTTP '+response.status));
     }
     target.body.textContent=data.text;
     window.dispatchEvent(new CustomEvent('avnivo:history-translation',{detail:{at:avnivoTurn.at,translation:data.text}}));
   }catch(error){
     if(token===typingToken)target.body.textContent='Tarjima amalga oshmadi: '+(error.name==='AbortError'?'vaqt tugadi':error.message||'tarmoq xatosi');
   }finally{
     clearTimeout(timeout);
     nowBottom.classList.remove('is-translating');
     target.history.scrollTop=target.history.scrollHeight;
   }
 }
 // Enforce the edit permission on every swap, including the previously edited panel.
 function enforcePermissions(){
   speakers.forEach(s=>{
     const isBottom=s.classList.contains('middle');
     const b=s.querySelector('.message-button');
     const i=s.querySelector('.message-input');
     b.disabled=!isBottom;
     b.setAttribute('aria-disabled',String(!isBottom));
     b.setAttribute('aria-label',isBottom?'Qo‘lda yozishni boshlash':'Yuqori bo‘lim: faqat tarjimani ko‘rish');
     i.readOnly=!isBottom;
     i.tabIndex=isBottom?0:-1;
     if(!isBottom && document.activeElement===i)i.blur();
   });
 }
 const oldAfterSwap=afterSwap;
 function showBottomEditor(){
   const bottom=app.querySelector('.speaker.middle');
   if(!bottom)return;
   const center=bottom.querySelector('.center');
   const compose=bottom.querySelector('.message-compose');
   compose.hidden=false;
   center.classList.add('is-composing');
   bottom.querySelector('.message-button').setAttribute('aria-expanded','true');
   // Do not focus automatically: tapping the field opens the keyboard.
   grow(bottom.querySelector('.message-input'));
 }
 window.avnivoComposer={beforeSwap,showBottomEditor,afterSwap:(top,bottom)=>{enforcePermissions();showBottomEditor();return oldAfterSwap(top,bottom)}};
 enforcePermissions();
 window.addEventListener('orientationchange',()=>setTimeout(resize,200),{passive:true});
})();
</script>

(()=>{

 window.avnivoPrepareSpeech=(original,speakerId)=>({

     recognition.lang=({ru:'ru-RU',en:'en-US',tr:'tr-TR',uz:'uz-UZ'}[window.avnivoOnlineLanguageForSpeaker?.(s.dataset.speaker)]||'uz-UZ');

 // AVNIVO cloud TTS: preserve translation and recognition; animate only actual playback.
 let activeAudio=null,activeUrl=null,activeButton=null,playbackId=0,pendingRequest=null;

  row.append(bubble);
  actions(row,text,language);
  return row;
 }
 for(const t of entry.turns){
  const item=node('div','avnivo-archive-message'+(String(t.speaker)===firstSpeaker?'':' from-second'));
  item.append(sentenceRow(t.source,t.sourceLang,'original'));
  if(t.translation)item.append(sentenceRow(t.translation,t.targetLang,'translated'));
  else item.append(sentenceRow('Tarjima kutilmoqda',t.targetLang,'translated'));
  chat.append(item);
 }
 detail.append(chat);list.append(detail);
}
function copyText(text,btn){
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy failed');};
 Promise.resolve().then(async()=>{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else fallback();btn.setAttribute('aria-label','Nusxalandi');}).catch(()=>alert('Nusxalash bajarilmadi'));
}
const historyButton=app.querySelector('.nav-btn[aria-label="Tarix (maket)"]');
if(historyButton){historyButton.setAttribute('aria-label','Tarix');historyButton.addEventListener('click',()=>{renderList();panel.hidden=false;});}
panel.querySelector('[data-archive-close]').addEventListener('click',()=>{stopArchiveAudio();panel.hidden=true;});
function decorate(line){
 if(line.querySelector('.avnivo-copy'))return;
 const body=line.querySelector('.translation-body');if(!body)return;
 const b=node('button','avnivo-copy');b.type='button';b.setAttribute('aria-label','Xabarni nusxalash');b.innerHTML=copySvg;
 b.addEventListener('click',()=>copyText(body.textContent||'',b));
 const read=line.querySelector('.read-message');if(read)line.insertBefore(b,read);else line.append(b);
}
const observer=new MutationObserver(()=>app.querySelectorAll('.translation-line').forEach(decorate));
app.querySelectorAll('.translation-history').forEach(h=>observer.observe(h,{childList:true,subtree:true}));
app.querySelectorAll('.translation-line').forEach(decorate);
})();
</script>

<script>
/* Unified single-device conversation UI; source and target selectors stay wired to original translation logic. */
(()=>{
 const app=document.getElementById('app');
 const source=document.getElementById('bottomLanguageSelect');
 const target=document.getElementById('upperLanguageSelect');
 const front=app.querySelector('.speaker.middle');
 if(!source||!target||!front)return;
 const bar=document.createElement('div');
 bar.className='avnivo-unified-languages';
 bar.innerHTML='<label class="avnivo-lang-pill"><span id="avnivoSourceName"></span></label><div class="avnivo-lang-flow" aria-hidden="true"><svg viewBox="0 0 24 14"><path d="M2 7h19m-6-5 6 5-6 5"/></svg><svg viewBox="0 0 24 14"><path d="M2 7h19m-6-5 6 5-6 5"/></svg></div><label class="avnivo-lang-pill"><span id="avnivoTargetName"></span></label><button type="button" class="avnivo-lang-exchange" id="avnivoLangExchange" aria-label="Tillar o‘rnini almashtirish" title="Tillarni almashtirish"><svg viewBox="0 0 32 32"><path d="M5 14a11 11 0 0 1 18-7l3 3"/><path d="M26 4v6h-6"/><path d="M27 18a11 11 0 0 1-18 7l-3-3"/><path d="M6 28v-6h6"/></svg></button>';
 front.append(bar);
 const pills=bar.querySelectorAll('.avnivo-lang-pill');
 pills[0].append(source);pills[1].append(target);
 const code=v=>String(v||'').split('-')[0].toUpperCase();
 const update=()=>{
  for(const [el,sel] of [[document.getElementById('avnivoSourceName'),source],[document.getElementById('avnivoTargetName'),target]]){
   const option=sel.selectedOptions[0];
   el.textContent=(option?.textContent||sel.value).trim()+' ( '+code(sel.value)+' )';
  }
 };
 source.addEventListener('change',update);target.addEventListener('change',update);
 const exchange=document.getElementById('avnivoLangExchange');
 exchange.addEventListener('click',()=>{
  const a=source.value,b=target.value;
  source.value=b;target.value=a;
  source.dispatchEvent(new Event('change',{bubbles:true}));
  target.dispatchEvent(new Event('change',{bubbles:true}));
  exchange.classList.remove('rotating');void exchange.offsetWidth;exchange.classList.add('rotating');bar.querySelector('.avnivo-lang-flow')?.classList.add('exchanging');
  setTimeout(()=>{exchange.classList.remove('rotating');bar.querySelector('.avnivo-lang-flow')?.classList.remove('exchanging');},500);
  update();
 });
 // Reuse the existing sensor permission flow; persist its user-selected state.
 const sensorToggle=document.getElementById('sensorToggle');
 const key='avnivo.single.sensor.enabled.v1';
 const originalLabel=()=>{exchange.classList.toggle('sensor-on',localStorage.getItem(key)==='1');};
 sensorToggle?.addEventListener('click',()=>setTimeout(()=>{
  const active=sensorToggle.textContent.includes('o‘chirish');
  localStorage.setItem(key,active?'1':'0');originalLabel();
 },180));
 originalLabel();
 if(localStorage.getItem(key)==='1'){
  window.addEventListener('load',()=>setTimeout(()=>{
   if(sensorToggle && !sensorToggle.textContent.includes('o‘chirish'))sensorToggle.click();
  },350),{once:true});
 }
 // Existing message history is still produced in two speaker logs.
 // Present both in the one visible conversation without modifying the underlying records.
 // The two-panel transcript mirroring was removed: it duplicated messages.
 // The visible chat is the single chronological message log.
 const reveal=()=>window.avnivoComposer?.showBottomEditor?.();
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',reveal,{once:true});
 else setTimeout(reveal,0);
 update();
})();
</script>

<script>
/* V13 single-screen send: independent of removed card-swap mechanism. */
(()=>{
 const app=document.getElementById('app');
 const speaker=app.querySelector('.speaker.middle');
 const input=speaker?.querySelector('.message-input');
 const compose=speaker?.querySelector('.message-compose');
 const history=speaker?.querySelector('.translation-history');
 const source=document.getElementById('bottomLanguageSelect');
 const target=document.getElementById('upperLanguageSelect');
 if(!input||!compose||!history||!source||!target)return;
 const send=document.createElement('button');
 send.type='button';send.className='avnivo-send-arrow';
 send.setAttribute('aria-label','Xabarni tarjimaga yuborish');
 send.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4M5 11l7-7 7 7"/></svg>';
 compose.append(send);
 let busy=false;
 const refresh=()=>{const ready=!!input.value.trim();send.classList.toggle('ready',ready);send.disabled=!ready||busy;};
 input.addEventListener('input',refresh);
 const initialSource=source.value;
 const add=(lang,text,kind)=>{
  const line=document.createElement('div');line.className='translation-line '+kind;
  const prefix=document.createElement('span');prefix.className='translation-prefix';prefix.textContent=lang.toUpperCase()+':';
  const body=document.createElement('span');body.className='translation-body';body.textContent=text;
  line.append(prefix,body);history.append(line);
  requestAnimationFrame(()=>{history.scrollTop=history.scrollHeight;});
  return body;
 };
 send.addEventListener('click',async()=>{
  const text=input.value.trim();if(!text||busy)return;
  const sourceLang=source.value,targetLang=target.value,at=Date.now();
  input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));
  send.classList.remove('sending');void send.offsetWidth;send.classList.add('sending');
  const sameDirection=sourceLang===initialSource;
  add(sourceLang,text,sameDirection?'outgoing':'incoming');
  const translation=add(targetLang,'Tarjima qilinmoqda…',sameDirection?'incoming':'outgoing');
  window.dispatchEvent(new CustomEvent('avnivo:history-turn',{detail:{speaker:'1',source:text,sourceLang,targetLang,translation:'',at}}));
  busy=true;refresh();
  try{
   if(sourceLang===targetLang){translation.textContent=text;}
   else{
    const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),30000);
    try{
     const response=await fetch('https://avnivo-translation-test-792624108019.europe-west1.run.app/api/translate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,source:sourceLang,target:targetLang}),signal:controller.signal
     });
     const data=await response.json().catch(()=>({}));
     if(!response.ok||typeof data.text!=='string'||!data.text.trim())throw Error('Tarjima xatosi: HTTP '+response.status);
     translation.textContent=data.text;
    }finally{clearTimeout(timeout);}
   }
   window.dispatchEvent(new CustomEvent('avnivo:history-translation',{detail:{at,translation:translation.textContent}}));
  }catch(e){translation.textContent=e.name==='AbortError'?'Tarjima vaqti tugadi':(e.message||'Tarjima bajarilmadi');}
  finally{busy=false;refresh();}
 });
 refresh();
})();
</script>
