# Cloud Build pipeline for the AVNIVO Translator release APK.
#
# Run:
#   gcloud builds submit --config build/android/cloudbuild.yaml \
#     --substitutions=_VERSION_CODE=1314,_BUCKET=gs://<artifact-bucket>,_TAG=avnivo-v1314 .
#
# Secrets (Secret Manager, never in the repo or in build logs):
#   avnivo-keystore-b64        base64 of the existing release keystore
#   avnivo-keystore-password   keystore password
#   avnivo-key-alias           key alias
#
# The build fails if the keystore certificate is not the one the installed app trusts
# (AVNIVO_EXPECTED_CERT_SHA256 below), so a different key cannot produce a broken update.
substitutions:
  _VERSION_CODE: "1314"
  _BUCKET: ""
  _TAG: "manual"
  _EXPECTED_CERT_SHA256: "12e7e26104c7a5110a849baec36d6916efe0b2494384749d4c733286aeeecb8e"

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: 3600s

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/avnivo-keystore-b64/versions/latest
      env: KEYSTORE_B64
    - versionName: projects/$PROJECT_ID/secrets/avnivo-keystore-password/versions/latest
      env: KEYSTORE_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/avnivo-key-alias/versions/latest
      env: KEY_ALIAS

steps:
  - id: toolchain
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/avnivo-android-builder:25e5bd2
      - build/android

  - id: build-sign-verify
    name: gcr.io/$PROJECT_ID/avnivo-android-builder:25e5bd2
    waitFor: ['toolchain']
    secretEnv: ['KEYSTORE_B64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS']
    env:
      - AVNIVO_VERSION_CODE=${_VERSION_CODE}
      - AVNIVO_EXPECTED_CERT_SHA256=${_EXPECTED_CERT_SHA256}
      - AVNIVO_OUT_DIR=/workspace/dist
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        umask 077
        printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/avnivo-release.jks
        export AVNIVO_KEYSTORE_FILE=/tmp/avnivo-release.jks
        export AVNIVO_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
        export AVNIVO_KEY_ALIAS="$KEY_ALIAS"
        export AVNIVO_KEY_PASSWORD="$KEYSTORE_PASSWORD"
        trap 'rm -f /tmp/avnivo-release.jks' EXIT
        scripts/build-release-apk.sh
        rm -f /tmp/avnivo-release.jks

  - id: publish
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['build-sign-verify']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_BUCKET}" || { echo "_BUCKET is required to publish"; exit 1; }
        apk=$(sed -n 's/^apk=//p' /workspace/dist/report.txt)
        sha=$(sed -n 's/^sha256=//p' /workspace/dist/report.txt)
        gcloud storage cp "$$apk" "${_BUCKET}/avnivo-translator/${_TAG}/$(basename "$$apk")"
        gcloud storage cp /workspace/dist/report.txt "${_BUCKET}/avnivo-translator/${_TAG}/report.txt"
        echo "APK: ${_BUCKET}/avnivo-translator/${_TAG}/$(basename "$$apk")"
        echo "SHA-256: $$sha"

images:
  - gcr.io/$PROJECT_ID/avnivo-android-builder:25e5bd2
