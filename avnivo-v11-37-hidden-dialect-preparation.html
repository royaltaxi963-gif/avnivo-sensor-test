<script>
const swapButton=document.getElementById('swap');
let swapping=false;
swapButton.addEventListener('click',async()=>{
  if(swapping)return;
  swapping=true;
  swapButton.disabled=true;
  // Hide the keyboard BEFORE measuring the panel travel distance.
  const focused=document.activeElement;
  if(focused?.matches?.('.message-input'))focused.blur();
  window.avnivoComposer?.beforeSwap();
  await new Promise(resolve=>setTimeout(resolve,320));
  const app=document.getElementById('app');
  const top=app.querySelector('.speaker.top');
  const bottom=app.querySelector('.speaker.middle');
  const flare=app.querySelector('.swap-flare');
  const distance=bottom.getBoundingClientRect().top-top.getBoundingClientRect().top;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration=reduceMotion?1:1450;
  let up,down;
  // Arc paths: upper recedes to the right; lower approaches from the left.
  // Both retain their own permanent gradient and their original content.
  const options={duration,easing:'linear',fill:'forwards'};
  try{
    if(!reduceMotion){
      swapButton.classList.add('is-swapping');
      flare?.classList.add('active');
    }
    top.style.zIndex='1';
    bottom.style.zIndex='3';
    up=bottom.animate([
      {offset:0,transform:'translate3d(0,0,0) scale(1) rotate(0deg)',filter:'brightness(1)',opacity:1},
      {offset:.16,transform:`translate3d(-12px,${-distance*.09}px,0) scale(1.045) rotate(-1deg)`,filter:'brightness(1.12)',opacity:1},
      {offset:.44,transform:`translate3d(-23px,${-distance*.42}px,0) scale(1.105) rotate(-1.8deg)`,filter:'brightness(1.24)',opacity:1},
      {offset:.72,transform:`translate3d(-12px,${-distance*.82}px,0) scale(1.055) rotate(-.7deg)`,filter:'brightness(1.12)',opacity:1},
      {offset:.92,transform:`translate3d(0,${-distance*1.015}px,0) scale(.995) rotate(0deg)`,filter:'brightness(1.02)',opacity:1},
      {offset:1,transform:`translate3d(0,${-distance}px,0) scale(1) rotate(0deg)`,filter:'brightness(1)',opacity:1}
    ],options);
    down=top.animate([
      {offset:0,transform:'translate3d(0,0,0) scale(1) rotate(0deg)',filter:'brightness(1)',opacity:1},
      {offset:.16,transform:`translate3d(11px,${distance*.09}px,0) scale(.96) rotate(1deg)`,filter:'brightness(.89)',opacity:.96},
      {offset:.44,transform:`translate3d(22px,${distance*.42}px,0) scale(.86) rotate(1.7deg)`,filter:'brightness(.72)',opacity:.86},
      {offset:.72,transform:`translate3d(12px,${distance*.82}px,0) scale(.92) rotate(.7deg)`,filter:'brightness(.83)',opacity:.92},
      {offset:.92,transform:`translate3d(0,${distance*1.015}px,0) scale(1.005) rotate(0deg)`,filter:'brightness(1)',opacity:1},
      {offset:1,transform:`translate3d(0,${distance}px,0) scale(1) rotate(0deg)`,filter:'brightness(1)',opacity:1}
    ],options);
    await Promise.all([up.finished,down.finished]);
    // Keep the final visual position while switching grid order.
    // Cancel animations only after the DOM has adopted the new positions.
    app.insertBefore(bottom,top);
    bottom.classList.replace('middle','top');
    top.classList.replace('top','middle');
    window.avnivoComposer?.afterSwap(bottom,top);
    // Keep the newly lower panel's composer visible without an extra icon tap.
    window.avnivoComposer?.showBottomEditor();
    up.cancel();down.cancel();
  }catch(e){
    // In case of interrupted animation, restore a usable UI.
    if(up)up.cancel();
    if(down)down.cancel();
    console.error('Panel exchange interrupted:',e);
  }finally{
    top.style.zIndex='';
    bottom.style.zIndex='';
    swapButton.classList.remove('is-swapping');
    flare?.classList.remove('active');
    swapping=false;
    swapButton.disabled=false;
  }
});

// Sensor preview only. No changes to swap animation or participant panels.
(()=>{
const sheet=document.getElementById('sensorSheet');
const toggle=document.getElementById('sensorToggle');
const status=document.getElementById('sensorStatus');
const x=document.getElementById('sensorX'),y=document.getElementById('sensorY');
let enabled=false,seen=false,raf=0,latest=null,startedAt=0;
const onOrientation=e=>{
 if(!enabled || !Number.isFinite(e.gamma) || !Number.isFinite(e.beta))return;
 latest={gamma:e.gamma,beta:e.beta};seen=true;
 // Sensor-controlled reflections: update CSS only, preserving the existing mic motion.
 const root=document.getElementById('app');
 root.style.setProperty('--shine-x',(50+Math.max(-35,Math.min(35,e.gamma*.7))).toFixed(1)+'%');
 root.style.setProperty('--shine-y',(40+Math.max(-30,Math.min(30,(e.beta-45)*.45))).toFixed(1)+'%');
 root.style.setProperty('--shine-strength','.85');
 root.style.setProperty('--message-upright',Math.max(-80,Math.min(80,-e.gamma)).toFixed(1)+'deg');
 const gold=document.getElementById('avnivoGold');if(gold)gold.setAttribute('gradientTransform','translate('+(Math.max(-.36,Math.min(.36,e.gamma/125))).toFixed(3)+' 0)');
 // Counter-rotate the glyph, not the tappable button. Gamma is the portrait roll approximation.
 const roll=Math.max(-80,Math.min(80,-e.gamma));
 const pitch=Math.max(-10,Math.min(10,(e.beta-45)*0.12));
 document.getElementById('mic').style.transform='rotate('+roll.toFixed(1)+'deg)';
 status.textContent='v8.7 | Mikrofon burilishi: '+roll.toFixed(1)+'°';
 if(!raf)raf=requestAnimationFrame(()=>{
  raf=0;if(!enabled||!latest)return;
  x.textContent=latest.gamma.toFixed(1)+'°';y.textContent=latest.beta.toFixed(1)+'°';
  status.textContent='v8.7 | Mikrofon burilishi: '+Math.max(-80,Math.min(80,-latest.gamma)).toFixed(1)+'°';
 });
};
function stop(){const root=document.getElementById('app');for(const key of ['--shine-x','--shine-y','--shine-strength','--message-upright'])root.style.removeProperty(key);const gold=document.getElementById('avnivoGold');if(gold)gold.removeAttribute('gradientTransform');enabled=false;document.getElementById('mic').style.removeProperty('transform');window.removeEventListener('deviceorientation',onOrientation);if(raf)cancelAnimationFrame(raf);raf=0;toggle.textContent='Sensorni yoqish';status.textContent='Sensor o‘chirilgan';x.textContent='—';y.textContent='—'}
document.getElementById('settingsBtn').addEventListener('click',()=>{sheet.hidden=false;toggle.focus()});
document.getElementById('sensorClose').addEventListener('click',()=>{sheet.hidden=true});
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});
toggle.addEventListener('click',async()=>{
 if(enabled){stop();return}
 if(!window.isSecureContext){status.textContent='Sensor uchun HTTPS talab qilinishi mumkin. Faylni xavfsiz manzilda oching.';return}
 if(typeof DeviceOrientationEvent==='undefined'){status.textContent='Brauzer ushbu sensor API sini qo‘llamaydi.';return}
 try{
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
   const result=await DeviceOrientationEvent.requestPermission();
   if(result!=='granted'){status.textContent='Sensor ruxsati berilmadi.';return}
  }
  enabled=true;seen=false;startedAt=Date.now();toggle.textContent='Sensorni o‘chirish';status.textContent='Sensor ma’lumotlari kutilmoqda…';
  // Close the opaque sensor dialog so the microphone is actually visible during the test.
  sheet.hidden=true;
  window.addEventListener('deviceorientation',onOrientation,{passive:true});
  setTimeout(()=>{if(enabled&&!seen&&Date.now()-startedAt>=2000)status.textContent='Ma’lumot kelmadi. Brauzer yoki telefon sensorni cheklayotgan bo‘lishi mumkin.'},2500);
 }catch(err){status.textContent='Sensorni ishga tushirib bo‘lmadi: '+(err?.message||'ruxsat xatosi')}
});
})();
</script>

<script>
/* v11.30: persistent incoming/outgoing chat messages and draft clearing. */
(()=>{
 const app=document.getElementById('app');
 const viewport=window.visualViewport;
 const speakers=[...app.querySelectorAll('.speaker')];
 const SLIDE_MS=1450;
 const buttons=speakers.map(s=>s.querySelector('.message-button'));
 let active=null,typingToken=0,keyboardTimer=0;
 const baseline=window.innerHeight;
 function resize(){
   if(!viewport)return;
   const h=Math.max(250,Math.round(viewport.height));
   const keyboard=h<Math.min(baseline,window.innerHeight)-110;
   app.classList.toggle('keyboard-open',keyboard);
   // Position fixed app relative to the visible viewport, including browser pan.
   app.style.height=h+'px';
   app.style.top=Math.max(0,Math.round(viewport.offsetTop))+'px';
 }
 if(viewport){
   viewport.addEventListener('resize',resize,{passive:true});
   viewport.addEventListener('scroll',resize,{passive:true});
 }
 function grow(input){
   input.style.height='24px';
   const cap=Math.max(38,Math.min((viewport?.height||window.innerHeight)*.19,130));
   input.style.height=Math.min(input.scrollHeight,cap)+'px';
 }
 function open(speaker,focus=true){
   const wasOpen=speaker.querySelector('.center').classList.contains('is-composing');
   const moving=speaker.querySelector('.message-button');
   const from=wasOpen?null:moving.getBoundingClientRect();
   const center=speaker.querySelector('.center');
   const compose=center.querySelector('.message-compose');
   const button=center.querySelector('.message-button');
   compose.hidden=false;
   center.classList.add('is-composing');
   button.setAttribute('aria-expanded','true');
   if(from){
     const to=moving.getBoundingClientRect();
     const dx=from.left-to.left,dy=from.top-to.top;
     if(Math.abs(dx)+Math.abs(dy)>1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
       // FLIP: animate the actual icon's old position to its new left-aligned position.
       moving.animate([{translate:dx+'px '+dy+'px'},{translate:'0px 0px'}],{duration:SLIDE_MS,easing:'cubic-bezier(.22,.61,.36,1)'});
     }
   }
   if(focus){const input=speaker.querySelector('.message-input');input.focus({preventScroll:true});grow(input);resize();}
 }
 function lock(speaker){
   active=speaker;app.classList.add('is-editing');
   speakers.forEach(s=>s.classList.toggle('is-editor',s===speaker));
 }
 buttons.forEach(button=>{
   const speaker=button.closest('.speaker');
   const input=speaker.querySelector('.message-input');

   button.addEventListener('click',()=>{
     // Only the panel currently at the bottom may accept manual text.
     if(!speaker.classList.contains('middle'))return;
     if(active&&active!==speaker)return;
     button.classList.remove('is-shaking');void button.offsetWidth;button.classList.add('is-shaking');
     setTimeout(()=>button.classList.remove('is-shaking'),400);
     // Only the tapped speaker opens; the other icon stays exactly in place.
     open(speaker,false);
     lock(speaker);
     // Focus must occur inside the trusted tap event for Android to show its keyboard.
     input.focus({preventScroll:true});
     grow(input);
     resize();
   });
   // The visible text box is itself the tap target, even during demo translation.
   const bubble=speaker.querySelector('.message-bubble');
   bubble.addEventListener('click',()=>{
     if(!speaker.classList.contains('middle'))return;
     if(input.readOnly)input.readOnly=false;
     input.focus({preventScroll:true});
   });
   input.addEventListener('focus',()=>{
     if(!speaker.classList.contains('middle')){input.blur();return;}
     lock(speaker);
   });
   input.addEventListener('input',()=>grow(input));
 });
 function beforeSwap(){
   // Prepare the text at the very start of the swap, without changing the UI.
   const speaking=app.querySelector('.speaker.middle');
   const original=speaking?.querySelector('.message-input')?.value.trim()||'';
   if(original){
     const detail=window.avnivoPrepareSpeech?.(original,speaking.dataset.speaker)||
       {originalText:original,preparedText:original,sourceLanguage:'unknown'};
     window.dispatchEvent(new CustomEvent('avnivo:speech-prepared',{detail}));
   }
   typingToken++;
   active=null;app.classList.remove('is-editing');
   speakers.forEach(s=>s.classList.remove('is-editor','is-translating'));
   // Reset the keyboard-specific geometry before panel exchange.
   app.classList.remove('keyboard-open');
   app.style.height='';
   app.style.top='';
 }
 async function afterSwap(nowTop,nowBottom){
   // The authored message stays with its speaker, now at the top.
   const input=nowTop.querySelector('.message-input');
   const source=input.value.trim();
   // Always clear the draft when its speaker changes position.
   input.value='';
   grow(input);
   // The other speaker is now the bottom editor. Reveal without focusing:
   // keyboard must open only after a user taps its text field.
   open(nowBottom,false);
   if(!source)return;
   const language=document.getElementById('upperLanguageSelect')?.value||'ru';
   const shortNames={ru:'РУ:',en:'EN:',tr:'TR:',uz:'UZ:'};
   function appendMessage(speaker,side,label,message){
     const history=speaker.querySelector('.translation-history');
     const line=document.createElement('div');
     line.className='translation-line '+side;
     const prefix=document.createElement('span');
     prefix.className='translation-prefix';
     prefix.textContent=label;
     const body=document.createElement('span');
     body.className='translation-body';
     body.textContent=message;
     line.append(prefix,body);
     history.append(line);
     history.scrollTop=history.scrollHeight;
     return {history,body};
   }
   const sourceLabel=nowTop.dataset.speaker==='1'?'UZ:':(shortNames[language]||'РУ:');
   appendMessage(nowTop,'outgoing',sourceLabel,source);
   const destLabel=nowBottom.dataset.speaker==='1'?'UZ:':(shortNames[language]||'РУ:');
   const target=appendMessage(nowBottom,'incoming',destLabel,'');
   const demo='Salom! Bu sinov tarjimasi.';
   const token=++typingToken;
   nowBottom.classList.add('is-translating');
   for(const letter of demo){
     if(token!==typingToken)break;
     target.body.textContent+=letter;
     target.history.scrollTop=target.history.scrollHeight;
     await new Promise(resolve=>setTimeout(resolve,85));
   }
   nowBottom.classList.remove('is-translating');
 }
 // Enforce the edit permission on every swap, including the previously edited panel.
 function enforcePermissions(){
   speakers.forEach(s=>{
     const isBottom=s.classList.contains('middle');
     const b=s.querySelector('.message-button');
     const i=s.querySelector('.message-input');
     b.disabled=!isBottom;
     b.setAttribute('aria-disabled',String(!isBottom));
     b.setAttribute('aria-label',isBottom?'Qo‘lda yozishni boshlash':'Yuqori bo‘lim: faqat tarjimani ko‘rish');
     i.readOnly=!isBottom;
     i.tabIndex=isBottom?0:-1;
     if(!isBottom && document.activeElement===i)i.blur();
   });
 }
 const oldAfterSwap=afterSwap;
 function showBottomEditor(){
   const bottom=app.querySelector('.speaker.middle');
   if(!bottom)return;
   const center=bottom.querySelector('.center');
   const compose=bottom.querySelector('.message-compose');
   compose.hidden=false;
   center.classList.add('is-composing');
   bottom.querySelector('.message-button').setAttribute('aria-expanded','true');
   // Do not focus automatically: tapping the field opens the keyboard.
   grow(bottom.querySelector('.message-input'));
 }
 window.avnivoComposer={beforeSwap,showBottomEditor,afterSwap:(top,bottom)=>{enforcePermissions();showBottomEditor();return oldAfterSwap(top,bottom)}};
 enforcePermissions();
 window.addEventListener('orientationchange',()=>setTimeout(resize,200),{passive:true});
})();
</script>
<script>
/* v11.35: real browser speech recognition when available; clearly labeled demo otherwise. */
(()=>{
 const app=document.getElementById('app');
 const mic=document.getElementById('mic');
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 const demoText='Assalomu alaykum, bugun biz yangi tarjimon ilovasini sinab ko‘ryapmiz. Men ovozim orqali xabar yozmoqchiman va har bir aytilgan so‘z ekranda ketma-ket paydo bo‘lishini ko‘rmoqchiman. Suhbatimiz davomida barcha xabarlar tartib bilan saqlanadi.';
 const wave='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>';
 const speakerSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9q4 3 0 6M18 6q7 6 0 12"/></svg>';
 app.querySelectorAll('.speaker').forEach(s=>{
   const bubble=s.querySelector('.message-bubble');
   const indicator=document.createElement('span');
   indicator.className='voice-indicator';
   indicator.setAttribute('aria-hidden','true');
   indicator.innerHTML=wave;
   bubble.insertBefore(indicator,bubble.querySelector('.message-input'));

 });
 let rec=null,activeSpeaker=null,demoTimer=null,session=0,spokenBase='',finalText='',isListening=false;
 // Conservative, opt-in dictionary: unambiguous written colloquialisms only.
 const dialectPairs=[['qivossan','qilyapsan'],['ketvossan','ketyapsan'],['kevoman','kelyapman'],['bo\u2018pti','bo\u2018libdi']];
 // Internal-only normalization. The visible transcript always remains untouched.
 const dialectPairs=[['qivossan','qilyapsan'],['ketvossan','ketyapsan'],['kevoman','kelyapman'],['bo‘pti','bo‘libdi']];
 function normalizeUz(text){
   return text.replace(/[\\p{L}‘’'ʻ]+/gu,word=>{
     const found=dialectPairs.find(([dialect])=>dialect===word.toLocaleLowerCase('uz'));
     return found ? found[1] : word;
   });
 }
 window.avnivoPrepareSpeech=(original,speakerId)=>({
   originalText:original,
   preparedText:speakerId==='1'?normalizeUz(original):original,
   sourceLanguage:speakerId==='1'?'uz':(document.getElementById('upperLanguageSelect')?.value||'ru')
 });
 function inputFor(s){return s.querySelector('.message-input')}
 function render(s,text){const i=inputFor(s);i.value=text;i.dispatchEvent(new Event('input',{bubbles:true}));i.scrollTop=i.scrollHeight}
 function clearVoice(){
   isListening=false;
   mic.classList.remove('active');
   mic.setAttribute('aria-pressed','false');
   mic.setAttribute('aria-label','Ovoz orqali yozishni boshlash');
   app.querySelectorAll('.speaker').forEach(s=>s.classList.remove('voice-listening'));
 }
 function stop(){
   session++;
   if(demoTimer){clearTimeout(demoTimer);demoTimer=null}
   if(rec){const old=rec;rec=null;try{old.stop()}catch(e){}}
   clearVoice();
 }
 function demo(s,token){
   const words=demoText.split(' ');
   let n=0;
   const next=()=>{
     if(token!==session||!isListening)return;
     n++;
     render(s,spokenBase+(spokenBase?' ':'')+words.slice(0,n).join(' '));
     if(n<words.length)demoTimer=setTimeout(next,260);
     else{demoTimer=null;clearVoice()}
   };
   demoTimer=setTimeout(next,260);
 }
 function begin(){
   const s=app.querySelector('.speaker.middle');
   if(!s)return;
   activeSpeaker=s;
   window.avnivoComposer?.showBottomEditor();
   const i=inputFor(s);
   spokenBase=i.value.trim();
   finalText='';
   // No automatic keyboard: user can tap the field to edit.
   if(document.activeElement===i)i.blur();
   s.classList.add('voice-mode','voice-listening');
   isListening=true;
   mic.classList.add('active');
   mic.setAttribute('aria-pressed','true');
   mic.setAttribute('aria-label','Ovoz orqali yozishni to‘xtatish');
   const token=++session;
   if(!Recognition){demo(s,token);return}
   try{
     const recognition=new Recognition();
     rec=recognition;
     recognition.lang=s.dataset.speaker==='1'?'uz-UZ':({ru:'ru-RU',en:'en-US',tr:'tr-TR',uz:'uz-UZ'}[document.getElementById('upperLanguageSelect')?.value]||'ru-RU');
     recognition.continuous=true;
     recognition.interimResults=true;
     recognition.onresult=e=>{
       if(token!==session)return;
       let interim='';
       for(let k=e.resultIndex;k<e.results.length;k++){
         const item=e.results[k],t=item[0].transcript.trim();
         if(item.isFinal)finalText+=(finalText?' ':'')+t;
         else interim+=(interim?' ':'')+t;
       }
       const combined=[spokenBase,finalText,interim].filter(Boolean).join(' ');
       render(s,combined);
     };
     recognition.onerror=e=>{
       if(token!==session)return;
       clearVoice();
       if(e.error==='not-allowed'||e.error==='service-not-allowed')alert('Mikrofonga ruxsat berilmagan. Brauzer sozlamalaridan ruxsat bering.');
       else if(e.error!=='no-speech'&&e.error!=='aborted')alert('Ovozni tanib bo‘lmadi: '+e.error);
     };
     recognition.onend=()=>{if(token===session){rec=null;clearVoice()}};
     recognition.start();
   }catch(e){rec=null;clearVoice();alert('Brauzerda ovoz tanish ishga tushmadi: '+e.message)}
 }
 mic.setAttribute('aria-label','Ovoz orqali yozishni boshlash');
 mic.addEventListener('click',()=>{if(isListening)stop();else begin()});
 const swap=document.getElementById('swap');
 swap.addEventListener('click',()=>{if(isListening)stop()},{capture:true});
 // Read aloud any saved chat message, including future messages.
 app.addEventListener('click',e=>{
   const btn=e.target.closest('.read-message');
   if(!btn)return;
   e.preventDefault();
   if(!('speechSynthesis' in window)){alert('Bu brauzer matnni ovoz chiqarib o‘qishni qo‘llamaydi.');return}
   const line=btn.closest('.translation-line');
   const message=line?.querySelector('.translation-body')?.textContent?.trim();
   if(!message)return;
   window.speechSynthesis.cancel();
   const utter=new SpeechSynthesisUtterance(message);
   const speaker=btn.closest('.speaker');
   utter.lang=speaker?.dataset.speaker==='1'?'uz-UZ':({ru:'ru-RU',en:'en-US',tr:'tr-TR',uz:'uz-UZ'}[document.getElementById('upperLanguageSelect')?.value]||'ru-RU');
   utter.rate=.94;
   window.speechSynthesis.speak(utter);
 });
 const observer=new MutationObserver(records=>{
   for(const record of records)for(const node of record.addedNodes){
     if(node.nodeType!==1||!node.classList?.contains('translation-line')||node.querySelector('.read-message'))continue;
     const b=document.createElement('button');
     b.type='button';b.className='read-message';b.setAttribute('aria-label','Xabarni ovoz chiqarib o‘qish');
     b.innerHTML=speakerSvg;
     node.append(b);
   }
 });
 app.querySelectorAll('.translation-history').forEach(h=>observer.observe(h,{childList:true}));
})();
</script>
</body></html>
