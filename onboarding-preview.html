<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AVNIVO — Birinchi kirish</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.screen{position:relative;min-height:100dvh;overflow:hidden;background:#000}.color-field{position:absolute;inset:-20%;opacity:0;background:radial-gradient(ellipse 60% 50% at 18% 78%,#0079c76b,transparent 72%),radial-gradient(ellipse 55% 55% at 83% 19%,#d39a3670,transparent 75%),radial-gradient(ellipse 55% 48% at 80% 86%,#035a9e54,transparent 75%),#06070b;transition:opacity 1.7s ease;animation:float 11s ease-in-out infinite alternate;pointer-events:none}.screen.reveal .color-field{opacity:1}@keyframes float{0%{transform:translate(-3%,1%) scale(1)}50%{transform:translate(2%,-3%) scale(1.09)}100%{transform:translate(-1%,3%) scale(1.04)}}.brand{position:absolute;left:50%;top:49%;width:96%;transform:translate(-50%,-50%) scale(.98);opacity:0;text-align:center;z-index:2;animation:fadebrand 1.7s ease-in-out forwards;transition:top 1.55s cubic-bezier(.22,.72,.16,1),transform 1.55s cubic-bezier(.22,.72,.16,1)}@keyframes fadebrand{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.brand-name{display:flex;align-items:baseline;justify-content:center;letter-spacing:.065em;font-size:clamp(43px,12vw,66px);font-weight:800;line-height:1.12}.brand-av{color:#fff}.brand-nivo{color:#e6b76c}.brand-translator{height:42px;margin-top:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5vw,24px);font-weight:450;color:#e8c89a;direction:ltr;white-space:nowrap}.brand-translator-text{max-width:92%;overflow:hidden}.brand-caret{height:1.05em;border-right:2px solid #e6b76c;margin-left:2px;animation:blink .85s step-end infinite}@keyframes blink{50%{opacity:0}}.brand-translator[dir=rtl] .brand-caret{border-right:0;border-left:2px solid #e6b76c;margin-left:0;margin-right:2px}.screen.reveal .brand{top:calc(env(safe-area-inset-top) + 95px);transform:translate(-50%,-50%) scale(.65)}.language-pill{position:absolute;z-index:3;left:50%;top:55%;width:min(84vw,390px);height:65px;display:flex;align-items:center;justify-content:center;padding:0 24px;transform:translate(-50%,80px);opacity:0;border:1px solid #d9af6c80;border-radius:22px;background:linear-gradient(115deg,#102d46d9,#30251bd9 55%,#132e48d9);box-shadow:0 12px 42px #0007,inset 0 1px #ffffff23;backdrop-filter:blur(20px);font-size:clamp(17px,5vw,21px);font-weight:550;color:#f6e6d1;white-space:nowrap;overflow:hidden;transition:opacity 1.4s ease,transform 1.55s cubic-bezier(.22,.72,.16,1)}.screen.reveal .language-pill{opacity:1;transform:translate(-50%,-50%)}.language-word{overflow:hidden;text-overflow:clip}.language-caret{height:1.1em;margin-left:3px;border-right:2px solid #f4c476;animation:blink .85s step-end infinite}@media(max-height:530px){.screen.reveal .brand{top:55px;transform:translate(-50%,-50%) scale(.52)}.language-pill{top:65%}}@media(prefers-reduced-motion:reduce){.color-field{animation:none}.brand{animation:none;opacity:1;transform:translate(-50%,-50%)}}
</style></head><body><main class="screen" id="screen"><div class="color-field"></div><div class="brand"><div class="brand-name"><span class="brand-av">AV</span><span class="brand-nivo">NIVO</span></div><div class="brand-translator" id="brand-line"><span class="brand-translator-text" id="brand-text"></span><span class="brand-caret"></span></div></div><div class="language-pill" aria-label="Til tanlash" role="button" tabindex="0"><span class="language-word" id="language-word"></span><span class="language-caret"></span></div></main><script>

const line=document.getElementById('brand-line'),text=document.getElementById('brand-text');
const order=Array.from({length:translationWords.length},(_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
let index=0,pos=0,erasing=false;const segment=w=>window.Intl&&Intl.Segmenter?Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(w),x=>x.segment):Array.from(w);
function tick(){const word=translationWords[order[index]],chars=segment(word);line.dir=/[\u0590-\u08ff]/.test(word)?'rtl':'ltr';if(!erasing){pos=Math.min(chars.length,pos+1);text.textContent=chars.slice(0,pos).join('');if(pos===chars.length){erasing=true;setTimeout(tick,1000)}else setTimeout(tick,90)}else{pos=Math.max(0,pos-1);text.textContent=chars.slice(0,pos).join('');if(!pos){erasing=false;index=(index+1)%order.length;setTimeout(tick,250)}else setTimeout(tick,50)}}
setTimeout(tick,500);
const languageNames=["O‘zbek tili","Русский язык","English","Türkçe","Қазақ тілі","العربية","فارسی","Deutsch","Français","Español","Italiano","Português","中文","日本語","한국어","हिन्दी","বাংলা","Bahasa Indonesia","Bahasa Melayu","Українська","Polski","Nederlands","Svenska","Norsk","Dansk","Suomi","Ελληνικά","עברית","ไทย","Tiếng Việt","Čeština","Română","Magyar","Azərbaycanca","Türkmen dili","Тоҷикӣ","Кыргыз тили","اردو","Kiswahili","Afrikaans","Filipino","Català","Euskara","Gaeilge","ქართული","Հայերեն","தமிழ்","తెలుగు","ಕನ್ನಡ","മലയാളം"];
let li=0,lp=0,le=false;const langEl=document.getElementById('language-word');function languageTick(){const chars=segment(languageNames[li]);if(!le){lp=Math.min(chars.length,lp+1);langEl.textContent=chars.slice(0,lp).join('');if(lp===chars.length){le=true;setTimeout(languageTick,900)}else setTimeout(languageTick,82)}else{lp=Math.max(0,lp-1);langEl.textContent=chars.slice(0,lp).join('');if(lp===0){le=false;li=(li+1)%languageNames.length;setTimeout(languageTick,230)}else setTimeout(languageTick,45)}}setTimeout(languageTick,4700);
setTimeout(()=>document.getElementById('screen').classList.add('reveal'),4700);
</script></body></html>
