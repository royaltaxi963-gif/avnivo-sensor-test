</style></head><body><main class="screen" id="screen"><div class="brand" aria-label="AVNIVO Tarjimon"><div class="brand-name"><span class="brand-av">AV</span><span class="brand-nivo">NIVO</span></div><div class="brand-translator" id="brand-line"><span class="brand-translator-text" id="brand-text"></span><span class="brand-caret"></span></div></div><section class="panel" aria-label="Birinchi sozlash"><div class="eyebrow">AVNIVO · BOSHLANG‘ICH SOZLASH</div><h1>Tilni tanlang</h1><p class="intro">Ilova interfeysi qaysi tilda bo‘lishini tanlang. Buni keyin sozlamalardan o‘zgartirishingiz mumkin.</p><label class="label" for="language">INTERFEYS TILI</label><select class="field" id="language"><option value="uz">🇺🇿 O‘zbekcha</option><option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option><option value="tr">🇹🇷 Türkçe</option><option value="kk">🇰🇿 Қазақша</option></select><div class="preview">🌐 100 tildagi tarjimon nomlari asosiy AVNIVO chatidagi kabi harfma-harf almashadi.</div><button class="next" id="next">Davom etish →</button><div class="foot">Birinchi kirish · 1-bosqich</div></section></main><script>
const translationWords=["Tarjimon","مترجم","مترجم","مترجم","ژباړن","Тарҷумон","Котормочу","Аудармашы","Terjimeçi","Tərcüməçi","Çevirmen","تەرجىمان","ترجمان","وەرگێڕ","Penterjemah","Penerjemah","অনুবাদক","Turjumaan","Mtafsiri","Mai fassara","މައުނާކުރާ","Prevodilac","Përkthyes","Fassara","Tekki","Орчуулагч","Переводчик","Translator","Traducteur","Übersetzer","Traductor","Traduttore","Tradutor","Vertaler","Översättare","Oversetter","Oversætter","Kääntäjä","Þýðandi","Tõlkija","Tulkotājs","Vertėjas","Tłumacz","Překladatel","Prekladateľ","Prevajalec","Prevoditelj","Преводилац","Преведувач","Преводач","Traducător","Fordító","Μεταφραστής","Թարգմանիչ","მთარგმნელი","מתרגם","अनुवादक","अनुवादक","अनुवादक","અનુવાદક","ਅਨੁਵਾਦਕ","மொழிபெயர்ப்பாளர்","అనువాదకుడు","ಅನುವಾದಕ","വിവർത്തകൻ","පරිවර්තකයා","นักแปล","ນັກແປ","អ្នកបកប្រែ","ဘာသာပြန်သူ","Biên dịch viên","翻译器","翻訳者","번역기","སྐད་སྒྱུར་བ","ተርጓሚ","ተርጓሚ","Hiikaa","Umhumushi","Umguquleli","Vertaler","Womasulira","Muturikiri","Umusemuzi","Omuvvuunuzi","Onítúmọ̀","Onye ntụgharị","Ɔkyerɛasefo","Gɔmeɖela","Mobongoli","Mpandika","Tradiktè","Tradukisto","Interpres","Aistritheoir","Cyfieithydd","Eadar-theangaiche","Itzultzailea","Traductor","Tradutor"];
const line=document.getElementById('brand-line'),text=document.getElementById('brand-text');
const order=Array.from({length:translationWords.length},(_,i)=>i);for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
let index=0,pos=0,erasing=false;const segment=w=>window.Intl&&Intl.Segmenter?Array.from(new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(w),x=>x.segment):Array.from(w);
function tick(){const word=translationWords[order[index]],chars=segment(word);line.dir=/[\u0590-\u08ff]/.test(word)?'rtl':'ltr';if(!erasing){pos=Math.min(chars.length,pos+1);text.textContent=chars.slice(0,pos).join('');if(pos===chars.length){erasing=true;setTimeout(tick,1000)}else setTimeout(tick,90)}else{pos=Math.max(0,pos-1);text.textContent=chars.slice(0,pos).join('');if(!pos){erasing=false;index=(index+1)%order.length;setTimeout(tick,250)}else setTimeout(tick,50)}}
setTimeout(tick,500);
setTimeout(()=>document.getElementById('screen').classList.add('reveal'),4300);
document.getElementById('next').addEventListener('click',()=>{const l=document.getElementById('language').value;localStorage.setItem('avnivo-onboarding-language',l);alert('Tanlangan til saqlandi: '+l+'. Keyingi darslik bosqichi hali qo‘shilmagan.')});
</script></body></html>
