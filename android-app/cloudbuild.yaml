# Independent Android release build for AVNIVO Translator.
#
# This is the same Gradle task the GitHub Actions `apk` job runs, expressed as a Cloud Build
# pipeline so an APK can still be produced when Actions is unavailable. It is deliberately
# self-contained: nothing here writes to the running Cloud Run backend, and the only network
# traffic is the pinned sherpa-onnx AAR, the pinned whisper.cpp tag, Maven/Google repositories and
# the model bucket the tests read.
#
# Run it with:
#   gcloud builds submit android-app \
#     --config=android-app/cloudbuild.yaml \
#     --substitutions=_VERSION_CODE=1315,_ABIS=arm64-v8a,armeabi-v7a
#
# Cost: an E2_HIGHCPU_8 worker bills about $0.02 per build-minute; a clean build of this project
# took 54 s for one ABI and roughly 6-9 minutes for two ABIs plus the native compiles. Cloud Build
# also includes 120 free build-minutes per day on the default pool. Confirm the current quota and
# billing state in the console before the first paid run — this file does not create any resource.

substitutions:
  _ABIS: 'arm64-v8a,armeabi-v7a'
  _VERSION_CODE: '1315'
  _BUCKET: 'avnivo-translator-builds'

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: '100'
  logging: CLOUD_LOGGING_ONLY

timeout: 2700s

availableSecrets:
  secretManager:
    # The existing release identity, byte-identical to the GitHub Actions secret. No new key is
    # generated here: an APK signed with a different key cannot be installed over the installed app.
    - versionName: projects/$PROJECT_ID/secrets/avnivo-keystore-b64/versions/latest
      env: KEYSTORE_BASE64
    - versionName: projects/$PROJECT_ID/secrets/avnivo-keystore-password/versions/latest
      env: AVNIVO_KEYSTORE_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/avnivo-key-alias/versions/latest
      env: AVNIVO_KEY_ALIAS
    - versionName: projects/$PROJECT_ID/secrets/avnivo-key-password/versions/latest
      env: AVNIVO_KEY_PASSWORD

steps:
  - id: toolchain
    name: eclipse-temurin:17-jdk-jammy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip curl git
        echo "toolchain ready: $(java -version 2>&1 | head -1)"

  - id: android-sdk
    name: eclipse-temurin:17-jdk-jammy
    entrypoint: bash
    env: ['ANDROID_HOME=/opt/android-sdk']
    args:
      - -c
      - |
        set -euo pipefail
        curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p /opt/android-sdk/cmdline-tools
        python3 -c "import zipfile;zipfile.ZipFile('/tmp/cmdline.zip').extractall('/opt/android-sdk/cmdline-tools')"
        mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
        yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
        /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
          'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

  - id: fetch-sources
    name: eclipse-temurin:17-jdk-jammy
    entrypoint: bash
    dir: android-app
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p app/libs
        curl -fsSL --retry 3 -o app/libs/sherpa-onnx-2.0.1.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
        test -s app/libs/sherpa-onnx-2.0.1.aar
        rm -rf app/src/main/cpp/whisper.cpp
        git clone --depth 1 --branch v1.7.4 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp
        test -f app/src/main/cpp/whisper.cpp/CMakeLists.txt

  - id: build-release-apk
    name: eclipse-temurin:17-jdk-jammy
    entrypoint: bash
    dir: android-app
    secretEnv: ['KEYSTORE_BASE64', 'AVNIVO_KEYSTORE_PASSWORD', 'AVNIVO_KEY_ALIAS', 'AVNIVO_KEY_PASSWORD']
    env:
      - 'ANDROID_HOME=/opt/android-sdk'
      - 'ANDROID_SDK_ROOT=/opt/android-sdk'
      - 'GRADLE_USER_HOME=/workspace/.gradle'
      - 'AVNIVO_VERSION_CODE=${_VERSION_CODE}'
      - 'AVNIVO_ABIS=${_ABIS}'
    args:
      - -c
      - |
        set -euo pipefail
        printf '%s' "$$KEYSTORE_BASE64" | base64 -d > /workspace/avnivo-release.jks
        export AVNIVO_KEYSTORE_FILE=/workspace/avnivo-release.jks
        gradle --no-daemon assembleRelease
        APK=$(ls app/build/outputs/apk/release/app-release.apk)
        cp "$APK" /workspace/AVNIVO-Translator-release.apk
        sha256sum /workspace/AVNIVO-Translator-release.apk | tee /workspace/sha256.txt
        stat -c '%s bytes' /workspace/AVNIVO-Translator-release.apk

  - id: verify-signature-and-contents
    name: eclipse-temurin:17-jdk-jammy
    entrypoint: bash
    env: ['ANDROID_HOME=/opt/android-sdk']
    args:
      - -c
      - |
        set -euo pipefail
        APK=/workspace/AVNIVO-Translator-release.apk
        /opt/android-sdk/build-tools/35.0.0/apksigner verify --print-certs "$APK" | tee /workspace/cert.txt
        # The fingerprint must match the identity the installed app already trusts.
        grep -qi '12e7e26104c7a5110a849baec36d6916efe0b2494384749d4c733286aeeecb8e' /workspace/cert.txt \
          || { echo "SIGNING_CERTIFICATE_MISMATCH"; exit 1; }
        unzip -l "$APK" | grep -c '\.so$' | xargs echo "native libraries:"

  - id: publish
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gsutil cp /workspace/AVNIVO-Translator-release.apk "gs://${_BUCKET}/android/avnivo-${_VERSION_CODE}.apk"
        gsutil cp /workspace/sha256.txt "gs://${_BUCKET}/android/avnivo-${_VERSION_CODE}.sha256"
        gsutil cp /workspace/cert.txt "gs://${_BUCKET}/android/avnivo-${_VERSION_CODE}.cert.txt"
        echo "download: https://storage.googleapis.com/${_BUCKET}/android/avnivo-${_VERSION_CODE}.apk"

artifacts:
  objects:
    location: 'gs://${_BUCKET}/cloudbuild/${BUILD_ID}'
    paths:
      - /workspace/AVNIVO-Translator-release.apk
      - /workspace/sha256.txt
      - /workspace/cert.txt
