const greetings=[["uz","Assalomu alaykum"],["ar","السلام عليكم"],["fa","السلام علیکم"],["ur","السلام علیکم"],["ps","السلام علیکم"],["tg","Ассалому алайкум"],["ky","Ассалому алейкум"],["kk","Ассалаумағалейкум"],["tk","Essalawmaleýkim"],["az","Əssəlamu əleykum"],["tr","Selamünaleyküm"],["ug","ئەسسالامۇ ئەلەيكۇم"],["sd","السلام عليڪم"],["ku","سڵاو"],["ms","Assalamualaikum"],["id","Assalamualaikum"],["bn","আসসালামু আলাইকুম"],["so","Asalaamu calaykum"],["sw","As-salaam alaikum"],["ha","Assalamu alaikum"],["dv","އައްސަލާމު އަލައިކުމް"],["bs","Esselamu alejkum"],["sq","Es-selamu alejkum"],["ff","Assalaamu alaikum"],["wo","Salaam aleekum"],["mn","Сайн байна уу"],["ru","Привет"],["en","Hello"],["fr","Bonjour"],["de","Hallo"],["es","Hola"],["it","Ciao"],["pt","Olá"],["nl","Hallo"],["sv","Hej"],["no","Hei"],["da","Hej"],["fi","Hei"],["is","Halló"],["et","Tere"],["lv","Sveiki"],["lt","Labas"],["pl","Cześć"],["cs","Ahoj"],["sk","Ahoj"],["sl","Živjo"],["hr","Bok"],["sr","Здраво"],["mk","Здраво"],["bg","Здравей"],["ro","Salut"],["hu","Szia"],["el","Γεια σου"],["hy","Բարև"],["ka","გამარჯობა"],["he","שלום"],["hi","नमस्ते"],["ne","नमस्ते"],["mr","नमस्कार"],["gu","નમસ્તે"],["pa","ਸਤ ਸ੍ਰੀ ਅਕਾਲ"],["ta","வணக்கம்"],["te","నమస్కారం"],["kn","ನಮಸ್ಕಾರ"],["ml","നമസ്കാരം"],["si","ආයුබෝවන්"],["th","สวัสดี"],["lo","ສະບາຍດີ"],["km","សួស្តី"],["my","မင်္ဂလာပါ"],["vi","Xin chào"],["zh","你好"],["ja","こんにちは"],["ko","안녕하세요"],["bo","བཀྲ་ཤིས་བདེ་ལེགས"],["am","ሰላም"],["ti","ሰላም"],["om","Akkam"],["zu","Sawubona"],["xh","Molo"],["af","Hallo"],["ny","Moni"],["sn","Mhoro"],["rw","Muraho"],["lg","Oli otya"],["yo","Ẹ n lẹ"],["ig","Ndewo"],["ak","Maakye"],["ee","Ŋdi"],["ln","Mbote"],["mg","Salama"],["ht","Bonjou"],["eo","Saluton"],["la","Salve"],["ga","Dia dhuit"],["cy","Helo"],["gd","Halò"],["eu","Kaixo"],["ca","Hola"],["gl","Ola"]];
const input=document.querySelector('.writing-area'),label=document.querySelector('.animated-greeting'),shell=document.querySelector('.writing-shell'),app=document.querySelector('.app');
const segment=text=>typeof Intl.Segmenter==='function'?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(text)].map(x=>x.segment):Array.from(text);
let index=0,position=0,erasing=false,timeout=0;
let previousLast=-1;
function shuffleRound(){
 const order=Array.from({length:greetings.length},(_,i)=>i);
 for(let i=order.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [order[i],order[j]]=[order[j],order[i]];
 }
 // Do not repeat the last language immediately across round boundaries.
 if(order.length>1&&order[0]===previousLast){
  const swapWith=1+Math.floor(Math.random()*(order.length-1));
  [order[0],order[swapWith]]=[order[swapWith],order[0]];
 }
 previousLast=order[order.length-1];
 return order;
}
let order=shuffleRound();
const delay=ms=>{clearTimeout(timeout);timeout=setTimeout(tick,ms)};
function tick(){
 if(input.value.length||messages.children.length||shell.classList.contains("voice-active")||shell.classList.contains("hold-voice")){label.hidden=true;return}
 label.hidden=false;
 const [lang,word]=greetings[order[index]];const letters=segment(word);
 label.lang=lang;label.dir=/^(ar|fa|ur|ps|ug|sd|dv|ku|yi|he)$/.test(lang)?'rtl':'auto';
 if(!erasing){
  position=Math.min(position+1,letters.length);label.textContent=letters.slice(0,position).join('');
  if(position===letters.length){erasing=true;delay(1000)}else delay(85);
 }else{
  position=Math.max(0,position-1);label.textContent=letters.slice(0,position).join('');
  if(position===0){erasing=false;index++;if(index===order.length){index=0;order=shuffleRound()}delay(240)}else delay(45);
 }
}
function layout(){
 const vv=window.visualViewport;
 const visibleHeight=vv?vv.height:window.innerHeight;
 const bottomOccluded=vv?Math.max(0,window.innerHeight-(vv.offsetTop+vv.height)):0;
 const margin=112;
 const languageBottom=bottomOccluded+43;
 document.documentElement.style.setProperty('--language-bottom',languageBottom+'px');
 document.documentElement.style.setProperty("--brand-center",(vv?(vv.offsetTop+vv.height/2):window.innerHeight/2)+"px");
 const rect=app.getBoundingClientRect();
 const side=Math.max(14,Math.min(24,window.innerWidth*.04));
 const left=Math.max(side,rect.left+11+side);
 const right=Math.min(window.innerWidth-side,rect.right-11-side);
 shell.style.setProperty('--input-left',left+'px');
 shell.style.setProperty('--input-width',Math.max(180,right-left)+'px');
 document.documentElement.style.setProperty('--input-left',left+'px');
 document.documentElement.style.setProperty('--input-width',Math.max(180,right-left)+'px');
 shell.style.setProperty('--input-bottom',(bottomOccluded+margin)+'px');
 shell.style.setProperty('--input-max',Math.max(60,Math.min(300,visibleHeight*.38))+'px');
 // Chat occupies the visible space ABOVE the composer and follows keyboard movement.
 const composerHeight=shell.getBoundingClientRect().height||60;
 const composerTop=window.innerHeight-(bottomOccluded+margin)-composerHeight;
 const chatTop=Math.max(58,(vv?.offsetTop||0)+60);
 document.documentElement.style.setProperty('--chat-top',chatTop+'px');
 document.documentElement.style.setProperty('--chat-left',left+'px');
 document.documentElement.style.setProperty('--chat-width',Math.max(180,right-left)+'px');
 document.documentElement.style.setProperty('--chat-bottom',Math.max(0,window.innerHeight-composerTop+17)+'px');
}
function resize(){
 layout();
 const max=Math.max(60,Math.min(300,(window.visualViewport?.height||window.innerHeight)*.43));
 input.style.height='auto';
 input.style.height=Math.min(Math.max(60,input.scrollHeight),max)+'px';
 input.style.overflowY=input.scrollHeight>max?'auto':'hidden';
 layout(); // Recalculate chat clearance after composer height changes.
 label.hidden=Boolean(input.value)||Boolean(document.querySelector(".sent-messages")?.children.length)||shell.classList.contains("voice-active");

 if(!input.value&&!timeout&&!shell.classList.contains("voice-active"))delay(180);
}
input.addEventListener('input',()=>{clearTimeout(timeout);timeout=0;resize()});
window.addEventListener('resize',resize,{passive:true});
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',resize,{passive:true});
 window.visualViewport.addEventListener('scroll',layout,{passive:true});
}
resize();delay(350);
const mic=shell.querySelector('.mic-icon');
const trace=shell.querySelector('.voice-trace-glow');
const languageRow=document.querySelector('.language-row');
const leftLanguage=languageRow.querySelector('.source-language'),rightLanguage=languageRow.querySelector('.target-language');
let languageTransitionTimer=0;
function selectLanguage(side){
 if(languageRow.dataset.selected===side)return;
 languageRow.dataset.selected=side;
 leftLanguage.classList.toggle('is-selected',side==='left');
 rightLanguage.classList.toggle('is-selected',side==='right');
 leftLanguage.setAttribute('aria-pressed',String(side==='left'));
 rightLanguage.setAttribute('aria-pressed',String(side==='right'));
 languageRow.classList.remove('direction-changing');
 void languageRow.offsetWidth;
 languageRow.classList.add('direction-changing');
 clearTimeout(languageTransitionTimer);
 languageTransitionTimer=setTimeout(()=>languageRow.classList.remove('direction-changing'),800);
}
// Language switching is non-editing interaction: do not steal textarea focus or summon IME.
function keepKeyboardStateOnLanguagePress(event){
 if(event.cancelable)event.preventDefault();
}
for(const chip of [leftLanguage,rightLanguage]){
 chip.addEventListener('pointerdown',keepKeyboardStateOnLanguagePress);
 chip.addEventListener('mousedown',keepKeyboardStateOnLanguagePress);
}
leftLanguage.addEventListener('click',()=>selectLanguage('left'));
rightLanguage.addEventListener('click',()=>selectLanguage('right'));
const messages=document.querySelector('.sent-messages');
const historyToggle=document.querySelector('.history-toggle'),historyOverlay=document.querySelector('.history-overlay'),historyDrawer=document.querySelector('.history-drawer'),historyClose=document.querySelector('.history-close'),historyNew=document.querySelector('.history-new'),historyItems=document.querySelector('.history-items');
const settingsToggle=document.querySelector('.settings-toggle'),settingsOverlay=document.querySelector('.settings-overlay'),settingsDrawer=document.querySelector('.settings-drawer'),settingsClose=document.querySelector('.settings-close');
let settingsOpen=false;
function setSettingsOpen(open){
 settingsOpen=open;
 settingsOverlay.hidden=!open;settingsOverlay.classList.toggle('open',open);
 settingsDrawer.classList.toggle('open',open);settingsDrawer.setAttribute('aria-hidden',String(!open));settingsDrawer.inert=!open;
 settingsToggle.setAttribute('aria-expanded',String(open));
}
settingsToggle.addEventListener('click',()=>{if(historyOpen)setHistoryOpen(false);setSettingsOpen(!settingsOpen)});
settingsClose.addEventListener('click',()=>setSettingsOpen(false));
settingsOverlay.addEventListener('click',()=>setSettingsOpen(false));
const historyStorageKey='avnivo.preview.chat-history.v1';
const activeHistoryKey='avnivo.preview.active-chat.v1';
const draftHistoryKey='avnivo.preview.chat-drafts.v1';
let historySessions=[],currentHistoryId=null,historyOpen=false,historyDrafts={};
function persistActiveChat(){try{if(currentHistoryId)localStorage.setItem(activeHistoryKey,currentHistoryId);else localStorage.removeItem(activeHistoryKey)}catch(e){}}
function persistDraft(){try{historyDrafts[currentHistoryId||'new']=input.value;localStorage.setItem(draftHistoryKey,JSON.stringify(historyDrafts))}catch(e){}}
function loadDraft(){input.value=historyDrafts[currentHistoryId||'new']||'';resize();syncComposerMode()}

function persistHistory(){try{localStorage.setItem(historyStorageKey,JSON.stringify(historySessions))}catch(e){console.warn('History storage unavailable',e)}}
function loadHistory(){
 try{
  const raw=JSON.parse(localStorage.getItem(historyStorageKey)||'[]');
  if(Array.isArray(raw))historySessions=raw.filter(x=>x&&typeof x.id==='string'&&Array.isArray(x.messages)).slice(0,100);
  const drafts=JSON.parse(localStorage.getItem(draftHistoryKey)||'{}');
  if(drafts&&typeof drafts==='object'&&!Array.isArray(drafts))historyDrafts=drafts;
  const activeId=localStorage.getItem(activeHistoryKey);
  if(activeId&&historySessions.some(x=>x.id===activeId))currentHistoryId=activeId;
 }catch(e){console.warn('Tarixni o‘qib bo‘lmadi',e)}
}
function historyDate(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('uz-UZ',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric',hour12:false}).format(d)}
function renderHistory(){
 historyItems.replaceChildren();
 if(!historySessions.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent='Hozircha saqlangan chatlar yo‘q. Yangi xabar yuborilganda shu yerda sana bilan paydo bo‘ladi.';historyItems.append(empty);return}
 for(const session of historySessions){
  const button=document.createElement('button');button.type='button';button.className='history-entry'+(session.id===currentHistoryId?' current':'');
  const title=document.createElement('span');title.className='history-entry-title';title.textContent='O‘zbek tili = русский язык';
  const date=document.createElement('span');date.className='history-entry-date';date.textContent='Saqlangan: '+historyDate(session.updatedAt||session.createdAt);
  button.append(title,date);button.addEventListener('click',()=>{persistDraft();currentHistoryId=session.id;persistActiveChat();restoreHistory(session);loadDraft();renderHistory();setHistoryOpen(false)});
  historyItems.append(button);
 }
}
function setHistoryOpen(open){
 if(open&&settingsOpen)setSettingsOpen(false);
 historyOpen=open;historyOverlay.hidden=!open;historyOverlay.classList.toggle('open',open);historyDrawer.classList.toggle('open',open);
 historyDrawer.setAttribute('aria-hidden',String(!open));historyDrawer.inert=!open;historyToggle.setAttribute('aria-expanded',String(open));
 if(open)renderHistory();
}
const PREVIEW_TRANSLATION='Tarjima sinov so‘zi';
let translationTimers=new Set();
function clearTranslationTimers(){for(const timer of translationTimers)clearTimeout(timer);translationTimers.clear()}
function previewTranslation(entry){return entry&&typeof entry==='object'&&entry.translation===PREVIEW_TRANSLATION}
function oppositeLanguage(language){return language==='right'?'left':'right'}
function typeTranslation(bubble,fullText,onDone){
 const letters=Array.from(fullText);let position=0;
 bubble.classList.add('typing');bubble.textContent='';
 function step(){
  if(!bubble.isConnected){bubble.classList.remove('typing');return}
  position++;bubble.textContent=letters.slice(0,position).join('');
  messages.scrollTop=messages.scrollHeight;
  if(position<letters.length){const timer=setTimeout(()=>{translationTimers.delete(timer);step()},85);translationTimers.add(timer)}
  else{bubble.classList.remove('typing');onDone?.()}
 }
 const timer=setTimeout(()=>{translationTimers.delete(timer);step()},350);translationTimers.add(timer);
}
function messageData(entry,firstLanguage){
 if(entry&&typeof entry==='object'&&!Array.isArray(entry))return {text:String(entry.text||''),language:entry.language==='right'?'right':'left'};
 return {text:String(entry),language:firstLanguage||'left'};
}
let speakingButton=null;
function stopSpeaking(){
 if(window.speechSynthesis)window.speechSynthesis.cancel();
 if(speakingButton){speakingButton.classList.remove('is-speaking');speakingButton.setAttribute('aria-pressed','false');speakingButton=null}
}
function playMessage(button,bubble,language){
 if(speakingButton===button){stopSpeaking();return}
 stopSpeaking();
 const text=bubble.textContent.trim();
 if(!text||!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=language==='right'?'ru-RU':'uz-UZ';
 utterance.rate=.95;
 const finish=()=>{if(speakingButton===button){button.classList.remove('is-speaking');button.setAttribute('aria-pressed','false');speakingButton=null}};
 utterance.onend=finish;utterance.onerror=finish;
 speakingButton=button;button.classList.add('is-speaking');button.setAttribute('aria-pressed','true');
 try{speechSynthesis.speak(utterance)}catch(e){finish()}
}
function attachSpeaker(bubble,language){
 const isLeft=bubble.classList.contains('message-left');
 const line=document.createElement('div');
 line.className='message-line '+(isLeft?'line-left':'line-right');
 const button=document.createElement('button');
 button.type='button';button.className='speak-message';
 button.setAttribute('aria-label','Xabarni ovoz chiqarib o‘qish');
 button.setAttribute('aria-pressed','false');
 button.innerHTML='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="speaker-core" d="M5 12h5l6-5v18l-6-5H5z"/><path class="sound-bars" d="M20 11q5 5 0 10M23 7q9 9 0 18"/></svg>';
 button.addEventListener('click',()=>playMessage(button,bubble,language));
 line.append(bubble,button);
 return line;
}
function renderChatBubble(entry,firstLanguage){
 const data=messageData(entry,firstLanguage);
 const bubble=document.createElement('div');
 bubble.className='sent-message '+(data.language===firstLanguage?'message-right':'message-left');
 bubble.textContent=data.text;
 return bubble;
}
function restoreHistory(session){
 stopSpeaking();
 messages.replaceChildren();
 const firstLanguage=session.firstLanguage||'left';
 clearTranslationTimers();
 for(const entry of session.messages.slice(-30)){
  const source=renderChatBubble(entry,firstLanguage);
  messages.append(attachSpeaker(source,messageData(entry,firstLanguage).language));
  if(previewTranslation(entry)){
   const language=entry.language==='right'?'right':'left';
   const translationBubble=renderChatBubble({text:entry.translation,language:oppositeLanguage(language)},firstLanguage);
   translationBubble.classList.add('translation-preview');
   messages.append(attachSpeaker(translationBubble,oppositeLanguage(language)));
  }
 }
 messages.scrollTop=messages.scrollHeight;
 if(typeof updateBrandVisibility==='function')updateBrandVisibility();
 label.hidden=Boolean(input.value)||messages.children.length>0;
}
function saveChatMessage(message,language,translation){
 let session=historySessions.find(x=>x.id===currentHistoryId);
 if(!session){session={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),title:'O‘zbek tili = русский язык',firstLanguage:language,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[]};historySessions.unshift(session);historyDrafts[session.id]=historyDrafts.new||'';delete historyDrafts.new;currentHistoryId=session.id;persistActiveChat()}
 if(!session.firstLanguage)session.firstLanguage=language;
 session.messages.push({text:message,language,translation});session.messages=session.messages.slice(-200);session.updatedAt=new Date().toISOString();
 historySessions.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));historySessions=historySessions.slice(0,100);persistHistory();
}
historyToggle.addEventListener('click',()=>setHistoryOpen(!historyOpen));
historyClose.addEventListener('click',()=>setHistoryOpen(false));
historyOverlay.addEventListener('click',()=>setHistoryOpen(false));
historyNew.addEventListener('click',()=>{stopSpeaking();clearTranslationTimers();persistDraft();currentHistoryId=null;persistActiveChat();messages.replaceChildren();loadDraft();syncComposerMode();setHistoryOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(settingsOpen)setSettingsOpen(false);if(historyOpen)setHistoryOpen(false)}});
// Initialize saved conversation only after microphone, brand and composer are ready.

const brand=document.querySelector('.center-brand');
const brandLine=document.querySelector('.brand-translator');
const brandText=document.querySelector('.brand-translator-text');
const translationWords=["Tarjimon","مترجم","مترجم","مترجم","ژباړن","Тарҷумон","Котормочу","Аудармашы","Terjimeçi","Tərcüməçi","Çevirmen","تەرجىمان","ترجمان","وەرگێڕ","Penterjemah","Penerjemah","অনুবাদক","Turjumaan","Mtafsiri","Mai fassara","މައުނާކުރާ","Prevodilac","Përkthyes","Fassara","Tekki","Орчуулагч","Переводчик","Translator","Traducteur","Übersetzer","Traductor","Traduttore","Tradutor","Vertaler","Översättare","Oversetter","Oversætter","Kääntäjä","Þýðandi","Tõlkija","Tulkotājs","Vertėjas","Tłumacz","Překladatel","Prekladateľ","Prevajalec","Prevoditelj","Преводилац","Преведувач","Преводач","Traducător","Fordító","Μεταφραστής","Թարգմանիչ","მთარგმნელი","מתרגם","अनुवादक","अनुवादक","अनुवादक","અનુવાદક","ਅਨੁਵਾਦਕ","மொழிபெயர்ப்பாளர்","అనువాదకుడు","ಅನುವಾದಕ","വിവർത്തകൻ","පරිවර්තකයා","นักแปล","ນັກແປ","អ្នកបកប្រែ","ဘာသာပြန်သူ","Biên dịch viên","翻译器","翻訳者","번역기","སྐད་སྒྱུར་བ","ተርጓሚ","ተርጓሚ","Hiikaa","Umhumushi","Umguquleli","Vertaler","Womasulira","Muturikiri","Umusemuzi","Omuvvuunuzi","Onítúmọ̀","Onye ntụgharị","Ɔkyerɛasefo","Gɔmeɖela","Mobongoli","Mpandika","Tradiktè","Tradukisto","Interpres","Aistritheoir","Cyfieithydd","Eadar-theangaiche","Itzultzailea","Traductor","Tradutor"];
if(translationWords.length!==greetings.length)throw Error('Translation language count mismatch');
let translationOrder=[],translationIndex=0,translationLast=-1,translationPosition=0,translationErasing=false,translationTimer=0;
function shuffleTranslationOrder(){
 const a=Array.from({length:translationWords.length},(_,i)=>i);
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 if(a.length>1&&a[0]===translationLast){const j=1+Math.floor(Math.random()*(a.length-1));[a[0],a[j]]=[a[j],a[0]]}
 translationLast=a[a.length-1];return a;
}
translationOrder=shuffleTranslationOrder();
function updateBrandVisibility(){brand.classList.toggle('brand-hidden',Boolean(input.value)||messages.children.length>0||shell.classList.contains('voice-active')||shell.classList.contains('hold-voice'))}
function translationTick(){
 const id=translationOrder[translationIndex];
 const [lang]=greetings[id],word=translationWords[id],chars=segment(word);
 brandLine.lang=lang;brandLine.dir=/^(ar|fa|ur|ps|ug|sd|dv|ku|yi|he)$/.test(lang)?'rtl':'ltr';
 if(!translationErasing){
  translationPosition=Math.min(chars.length,translationPosition+1);
  brandText.textContent=chars.slice(0,translationPosition).join('');
  if(translationPosition===chars.length){translationErasing=true;translationTimer=setTimeout(translationTick,1000)}
  else translationTimer=setTimeout(translationTick,90);
 }else{
  translationPosition=Math.max(0,translationPosition-1);
  brandText.textContent=chars.slice(0,translationPosition).join('');
  if(translationPosition===0){
   translationErasing=false;translationIndex++;
   if(translationIndex===translationOrder.length){translationIndex=0;translationOrder=shuffleTranslationOrder()}
   translationTimer=setTimeout(translationTick,250);
  }else translationTimer=setTimeout(translationTick,50);
 }
}
translationTimer=setTimeout(translationTick,500);

function syncComposerMode(){
 const typing=input.value.length>0;
 shell.classList.toggle('text-mode',typing&&!active);
 mic.setAttribute('aria-label',typing&&!active?'Matnni yuborish':'Mikrofonni yoqish');
 mic.setAttribute('aria-pressed',String(active));
 mic.disabled=typing&&!active&&!input.value.trim();
 updateBrandVisibility();
 label.hidden=typing||messages.children.length>0||active||shell.classList.contains('hold-voice');
}
function sendMessage(){
 const message=input.value.trim();
 if(!message)return;
 const language=languageRow.dataset.selected==='right'?'right':'left';
 let session=historySessions.find(x=>x.id===currentHistoryId);
 const firstLanguage=session?.firstLanguage||language;
 const sourceBubble=renderChatBubble({text:message,language},firstLanguage);
 messages.appendChild(attachSpeaker(sourceBubble,language));
 saveChatMessage(message,language,PREVIEW_TRANSLATION);
 const translationBubble=renderChatBubble({text:'',language:oppositeLanguage(language)},firstLanguage);
 translationBubble.classList.add('translation-preview');
 messages.appendChild(attachSpeaker(translationBubble,oppositeLanguage(language)));
 typeTranslation(translationBubble,PREVIEW_TRANSLATION);
 while(messages.children.length>60)messages.firstElementChild.remove();
 messages.scrollTop=messages.scrollHeight;
 input.value='';persistDraft();clearTimeout(timeout);timeout=0;resize();syncComposerMode();delay(300);
}
input.addEventListener('focus',syncComposerMode);
input.addEventListener('blur',()=>requestAnimationFrame(syncComposerMode));
input.addEventListener('input',()=>{syncComposerMode();persistDraft()});
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendMessage()}});

let mediaStream=null,audioContext=null,analyser=null,samples=null,frame=0,active=false,requestToken=0,level=0;
const idleWave=()=>{trace.style.background='transparent';trace.style.filter='drop-shadow(0 0 5px #25baff)';};
function draw(){
 if(!active||!analyser)return;
 analyser.getByteTimeDomainData(samples);
 let sum=0;
 for(let i=0;i<samples.length;i++){const v=(samples[i]-128)/128;sum+=v*v}
 const rms=Math.sqrt(sum/samples.length);
 level=level*.7+Math.min(1,rms*9)*.3;
 const amplitude=Math.max(1.2,Math.min(13,level*16));
 const points=[];
 const n=60;
 for(let i=0;i<=n;i++){
  const x=i/n*100;
  const envelope=Math.pow(Math.sin(Math.PI*i/n),.7);
  const y=16+Math.sin(i*.83+performance.now()*.014)*amplitude*envelope+Math.sin(i*.29+performance.now()*.02)*amplitude*.27*envelope;
  points.push(x.toFixed(2)+'% '+y.toFixed(2)+'px');
 }
 const wave='polygon(0 50%, '+points.join(', ')+', 100% 50%)';
 trace.style.clipPath='none';
 const path='M '+Array.from({length:n+1},(_,i)=>{const x=i/n*100,y=16+Math.sin(i*.83+performance.now()*.014)*amplitude*Math.sin(Math.PI*i/n);return x.toFixed(2)+','+y.toFixed(2)}).join(' L ');
 const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="#65d9ff" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';
 trace.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
 trace.style.backgroundSize='100% 100%';
 trace.style.filter='drop-shadow(0 0 '+(4+level*14).toFixed(1)+'px #00aeff)';
 frame=requestAnimationFrame(draw);
}
async function stopVoice(){
 requestToken++;active=false;cancelAnimationFrame(frame);
 shell.classList.remove('voice-active');mic.setAttribute('aria-pressed','false');mic.setAttribute('aria-label','Mikrofonni yoqish');syncComposerMode();
 if(mediaStream){mediaStream.getTracks().forEach(track=>track.stop());mediaStream=null}
 if(audioContext){const context=audioContext;audioContext=null;await context.close().catch(()=>{})}
 analyser=null;samples=null;level=0;idleWave();
 if(!input.value){clearTimeout(timeout);timeout=0;delay(300)}
}
async function startVoice(){
 if(!navigator.mediaDevices?.getUserMedia){return}
 const token=++requestToken;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  if(token!==requestToken){stream.getTracks().forEach(track=>track.stop());return}
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context){stream.getTracks().forEach(track=>track.stop());return}
  const ctx=new Context();await ctx.resume();
  if(token!==requestToken){stream.getTracks().forEach(track=>track.stop());await ctx.close();return}
  const source=ctx.createMediaStreamSource(stream),a=ctx.createAnalyser();
  a.fftSize=1024;a.smoothingTimeConstant=.22;source.connect(a);
  mediaStream=stream;audioContext=ctx;analyser=a;samples=new Uint8Array(a.fftSize);active=true;
  clearTimeout(timeout);timeout=0;label.hidden=true;
  mic.setAttribute('aria-pressed','true');mic.setAttribute('aria-label','Mikrofonni o‘chirish');
  shell.classList.add('voice-active');shell.classList.remove('text-mode');updateBrandVisibility();
  frame=requestAnimationFrame(draw);
  stream.getAudioTracks()[0]?.addEventListener('ended',()=>{if(active)stopVoice()},{once:true});
 }catch(error){if(token===requestToken){mic.setAttribute('aria-label','Mikrofonga ruxsat berilmadi');console.warn('Microphone unavailable',error)}}
}

const voiceHint=document.querySelector('.voice-hint');
const SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
let holdTimer=0,holdStarted=false,holdPointer=null,holdSuppressClick=false,holdRecognizer=null,holdBase='',holdTranscript='',holdFinal='',holdSession=0,holdWaveStream=null,holdWaveContext=null,holdWaveFrame=0,holdWaveAnalyser=null;
function hint(message){voiceHint.textContent=message;voiceHint.hidden=!message}
function appendTranscript(base,transcript){
 const spoken=transcript.trim();
 if(!spoken)return base;
 return base+(base&&!/\s$/.test(base)?' ':'')+spoken;
}
async function startHoldWave(session){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(session!==holdSession||!holdStarted){stream.getTracks().forEach(t=>t.stop());return}
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context){stream.getTracks().forEach(t=>t.stop());return}
  const ctx=new Context();await ctx.resume();
  if(session!==holdSession||!holdStarted){stream.getTracks().forEach(t=>t.stop());await ctx.close();return}
  const a=ctx.createAnalyser();a.fftSize=1024;a.smoothingTimeConstant=.24;
  ctx.createMediaStreamSource(stream).connect(a);
  holdWaveStream=stream;holdWaveContext=ctx;holdWaveAnalyser=a;
  const bytes=new Uint8Array(a.fftSize);
  function animate(){
   if(session!==holdSession||!holdStarted)return;
   a.getByteTimeDomainData(bytes);let sum=0;
   for(const b of bytes){const x=(b-128)/128;sum+=x*x}
   const rms=Math.sqrt(sum/bytes.length),amp=Math.max(1.5,Math.min(13,rms*130));
   const now=performance.now();
   const path='M '+Array.from({length:61},(_,i)=>{
    const x=i/60*100,env=Math.sin(Math.PI*i/60);
    const y=16+Math.sin(i*.76+now*.014)*amp*env;
    return x.toFixed(2)+','+y.toFixed(2);
   }).join(' L ');
   const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" preserveAspectRatio="none"><path d="'+path+'" fill="none" stroke="#65d9ff" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>';
   trace.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
   trace.style.backgroundSize='100% 100%';
   trace.style.filter='drop-shadow(0 0 '+Math.min(17,4+rms*100)+'px #00aeff)';
   holdWaveFrame=requestAnimationFrame(animate);
  }
  animate();
 }catch(e){if(session===holdSession&&holdStarted)hint('Mikrofon ruxsatini tekshiring')}
}
function finishHold(){
 if(!holdStarted)return;
 holdStarted=false;holdSession++;
 shell.classList.remove('hold-voice');cancelAnimationFrame(holdWaveFrame);
 if(holdWaveStream){holdWaveStream.getTracks().forEach(t=>t.stop());holdWaveStream=null}
 if(holdWaveContext){const ctx=holdWaveContext;holdWaveContext=null;ctx.close().catch(()=>{})}
 holdWaveAnalyser=null;trace.style.backgroundImage='none';
 if(holdRecognizer){try{holdRecognizer.stop()}catch(e){}}
 else {input.value=appendTranscript(holdBase,holdFinal||holdTranscript);persistDraft();resize();syncComposerMode();hint('')}
 syncComposerMode();
}
function beginHold(){
 if(!input.value.trim()||active||holdStarted)return;
 holdStarted=true;holdSession++;
 holdBase=input.value;holdTranscript='';holdFinal='';
 shell.classList.add('hold-voice');shell.classList.remove('text-mode');
 mic.setAttribute('aria-label','Barmoqni uzib ovoz yozishni tugatish');
 clearTimeout(timeout);timeout=0;label.hidden=true;
 hint('Gapiring · tugatish uchun qo‘yib yuboring');
 const session=holdSession;
 if(!SpeechAPI){hint('Bu Chrome’da ovozni matnga aylantirish mavjud emas');return}
 try{
  const recognition=new SpeechAPI();holdRecognizer=recognition;
  recognition.lang=document.documentElement.lang||'uz-UZ';
  recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;
  recognition.onresult=event=>{
   let finalText='',interim='';
   for(let i=0;i<event.results.length;i++){
    const text=event.results[i][0]?.transcript||'';
    if(event.results[i].isFinal)finalText+=text+' ';else interim+=text+' ';
   }
   holdFinal=finalText.trim();holdTranscript=(finalText+interim).trim();
  };
  recognition.onerror=e=>{if(holdRecognizer===recognition)hint('Ovoz tanish: '+e.error)};
  recognition.onend=()=>{
   if(holdRecognizer!==recognition)return;
   if(holdStarted){finishHold()}
   holdRecognizer=null;
   input.value=appendTranscript(holdBase,holdFinal||holdTranscript);
   persistDraft();resize();syncComposerMode();hint('');
  };
  recognition.start();
  startHoldWave(session);
 }catch(e){hint('Ovoz tanishni ishga tushirib bo‘lmadi');finishHold()}
}
function clearHoldTimer(){clearTimeout(holdTimer);holdTimer=0}
// Android IME policy: keep an already visible keyboard, but never resurrect a dismissed one.
const viewport=window.visualViewport;
let keyboardReferenceHeight=viewport?.height||window.innerHeight;
let keyboardWasVisible=false;
function isKeyboardVisible(){
 const v=window.visualViewport;
 if(!v)return false;
 const occluded=Math.max(0,window.innerHeight-(v.height+v.offsetTop));
 return Math.max(occluded,keyboardReferenceHeight-v.height)>140;
}
function reconcileKeyboardFocus(){
 const visible=isKeyboardVisible();
 if(keyboardWasVisible&&!visible&&document.activeElement===input){
  input.blur(); // Back / keyboard-hide has dismissed the IME; release stale textarea focus.
 }
 keyboardWasVisible=visible;
 if(!visible){
  const height=viewport?.height||window.innerHeight;
  keyboardReferenceHeight=Math.max(keyboardReferenceHeight,height);
 }
}
if(viewport)viewport.addEventListener('resize',reconcileKeyboardFocus,{passive:true});
window.addEventListener('resize',reconcileKeyboardFocus,{passive:true});
function preserveKeyboardOnMicPress(event){
 if(document.activeElement!==input)return;
 if(isKeyboardVisible()){
  // Prevent the button from stealing textarea focus while the IME is genuinely open.
  event.preventDefault();
 }else{
  // Android may leave the textarea focused after the user hides the keyboard.
  // Explicitly clear that stale focus before invoking audio capture.
  input.blur();
 }
}
mic.addEventListener('pointerdown',event=>{
 // Preserve textarea focus and Android keyboard while pressing the action button.
 preserveKeyboardOnMicPress(event);
 if(event.button!==0||!input.value.trim()||active)return;
 holdPointer=event.pointerId;holdSuppressClick=false;
 try{mic.setPointerCapture(event.pointerId)}catch(e){}
 clearHoldTimer();holdTimer=setTimeout(()=>{holdTimer=0;holdSuppressClick=true;beginHold()},1050);
});
function releaseHold(event){
 if(holdPointer===null||event.pointerId!==holdPointer)return;
 const wasHold=holdStarted;clearHoldTimer();holdPointer=null;
 if(wasHold){holdSuppressClick=true;finishHold()}
}
mic.addEventListener('pointerup',releaseHold);
mic.addEventListener('mousedown',preserveKeyboardOnMicPress);
mic.addEventListener('pointercancel',releaseHold);
mic.addEventListener('lostpointercapture',event=>{if(holdPointer===event.pointerId)releaseHold(event)});
mic.addEventListener('contextmenu',event=>{if(holdTimer||holdStarted)event.preventDefault()});
mic.addEventListener('click',event=>{
 if(holdSuppressClick){event.preventDefault();holdSuppressClick=false;return}
 if(active)stopVoice();else if(shell.classList.contains('text-mode'))sendMessage();else if(!holdStarted)startVoice();
});

// All dependent const bindings and handlers are initialized before restoring a saved draft.
loadHistory();if(currentHistoryId){const current=historySessions.find(x=>x.id===currentHistoryId);if(current)restoreHistory(current)}loadDraft();renderHistory();
window.addEventListener('pagehide',()=>{stopSpeaking();if(active)stopVoice()});

})();
</script>
