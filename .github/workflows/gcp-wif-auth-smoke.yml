name: Google Cloud WIF authentication smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required GitHub secrets
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "::error::Missing GCP_SERVICE_ACCOUNT"; exit 1; }
          echo "Both required configuration values are present."
      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Confirm short-lived access token was issued
        run: echo "Workload Identity Federation authentication succeeded. No deploy performed."
