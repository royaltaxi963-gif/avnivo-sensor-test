name: Diagnose Chirp 2 STT 502 (read-only)

# Read-only diagnostics for the /api/transcribe-google 502. Uses the same
# keyless WIF auth as the deploy workflows. Performs no writes and no deploys.
on:
  workflow_dispatch:
  # Path-scoped push trigger so the diagnostic can run from a feature branch
  # (workflow_dispatch requires the file to exist on the default branch).
  push:
    paths: ['.github/diagnose-502-request']

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: project-6bcf7fe6-cb55-49b7-9f4
      REGION: europe-west1
      SERVICE: avnivo-sensor-test
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Identity and service config
        shell: bash
        run: |
          set -uo pipefail
          echo "## Active principal (CI)"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo "## Cloud Run service"
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='yaml(metadata.name,spec.template.spec.serviceAccountName,status.traffic)' || true
          echo "## Recent revisions (creation time + service account)"
          gcloud run revisions list --service="$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='table(metadata.name,metadata.creationTimestamp,spec.serviceAccountName)' --limit=8 || true

      - name: Enabled relevant APIs
        shell: bash
        run: |
          gcloud services list --project="$PROJECT_ID" --enabled \
            --filter='config.name:(speech.googleapis.com OR run.googleapis.com)' \
            --format='value(config.name)' || true

      - name: Runtime service account state and IAM
        shell: bash
        run: |
          set -uo pipefail
          SA="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          echo "Runtime SA: $SA"
          if [ -n "$SA" ]; then
            gcloud iam service-accounts describe "$SA" --project="$PROJECT_ID" \
              --format='yaml(email,disabled,displayName)' || true
          fi
          echo "## Project IAM bindings for that SA"
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json \
            | jq -r --arg sa "$SA" '.bindings[] | select(.members | index("serviceAccount:"+$sa)) | .role' || true
          echo "## All bindings mentioning roles/speech or the default compute SA"
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json \
            | jq -r '.bindings[] | select((.role|test("speech|serviceusage|aiplatform")) or (.members|join(" ")|test("compute@developer"))) | "\(.role): \(.members|join(", "))"' || true

      - name: Cloud Run logs with full payload (last 3h)
        shell: bash
        run: |
          set -uo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="avnivo-sensor-test" AND severity>=WARNING' \
            --project="$PROJECT_ID" --limit=40 --freshness=3h \
            --format='value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error,jsonPayload.detail,httpRequest.status)' || true

      - name: IAM / policy changes in the failure window
        shell: bash
        run: |
          set -uo pipefail
          echo "## Admin activity: SetIamPolicy and service account changes (last 6h)"
          gcloud logging read \
            'logName:"cloudaudit.googleapis.com%2Factivity" AND (protoPayload.methodName:"SetIamPolicy" OR protoPayload.methodName:"DeleteServiceAccount" OR protoPayload.methodName:"CreateServiceAccount")' \
            --project="$PROJECT_ID" --limit=40 --freshness=6h \
            --format='value(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail)' || true

      - name: Runtime SA IAM policy and impersonated recognize
        shell: bash
        run: |
          set -uo pipefail
          RUNTIME_SA="avnivo-speech-translator@$PROJECT_ID.iam.gserviceaccount.com"
          echo "## SA-level IAM policy for $RUNTIME_SA"
          gcloud iam service-accounts get-iam-policy "$RUNTIME_SA" --project="$PROJECT_ID" --format=json || true
          echo "## List service accounts (spot deletions)"
          gcloud iam service-accounts list --project="$PROJECT_ID" \
            --format='table(email,disabled)' || true
          echo "## Recognize AS the runtime SA (impersonation)"
          B64="$(base64 -w0 verification/chirp2_campaign/fixtures/en-US-5s.wav)"
          cat > /tmp/req.json <<JSON
          {"config":{"autoDecodingConfig":{},"languageCodes":["en-US"],"model":"chirp_2"},"content":"$B64"}
          JSON
          if TOKEN="$(gcloud auth print-access-token --impersonate-service-account="$RUNTIME_SA" 2>/tmp/imp.err)"; then
            curl -s -w '\nHTTP_CODE=%{http_code}\n' \
              -X POST \
              "https://us-central1-speech.googleapis.com/v2/projects/$PROJECT_ID/locations/us-central1/recognizers/_:recognize" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/req.json | sed 's/\("transcript": *"\)[^"]*/\1<redacted>/'
          else
            echo "Impersonation failed (no Service Account Token Creator):"
            cat /tmp/imp.err
          fi

      - name: App container error logs (all severities, last 3h)
        shell: bash
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="avnivo-sensor-test" AND resource.labels.revision_name="avnivo-sensor-test-00014-qf9"' \
            --project="$PROJECT_ID" --limit=60 --freshness=3h \
            --format='value(timestamp,severity,textPayload)' || true

      - name: App container ERROR logs raw JSON (last 3h)
        shell: bash
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="avnivo-sensor-test" AND severity>=ERROR' \
            --project="$PROJECT_ID" --limit=3 --freshness=3h --format=json \
            | jq -c '.[] | {ts:.timestamp, sev:.severity, text:.textPayload, json:.jsonPayload, http:.httpRequest}' 2>/dev/null || true
          echo "## speech.googleapis.com raw entries"
          gcloud logging read 'logName:"speech.googleapis.com"' \
            --project="$PROJECT_ID" --limit=3 --freshness=4h --format=json \
            | jq -c '.[] | {ts:.timestamp, sev:.severity, text:.textPayload, payload:.protoPayload}' 2>/dev/null || true

      - name: Deployed revision image and labels
        shell: bash
        run: |
          set -uo pipefail
          for rev in avnivo-sensor-test-00014-qf9 avnivo-sensor-test-00013-qeq avnivo-sensor-test-00011-xl4; do
            echo "## $rev"
            gcloud run revisions describe "$rev" --project="$PROJECT_ID" --region="$REGION" \
              --format='yaml(spec.containers[0].image,metadata.labels,metadata.annotations."run.googleapis.com/execution-environment")' || true
          done

      - name: Any log mentioning the runtime SA or speech API (last 4h)
        shell: bash
        run: |
          set -uo pipefail
          echo "## runtime SA principal in any log"
          gcloud logging read \
            '"avnivo-speech-translator@project-6bcf7fe6-cb55-49b7-9f4.iam.gserviceaccount.com"' \
            --project="$PROJECT_ID" --limit=40 --freshness=4h \
            --format='value(timestamp,severity,resource.type,textPayload,jsonPayload.message)' || true
          echo "## speech.googleapis.com API logs"
          gcloud logging read \
            'logName:"speech.googleapis.com"' \
            --project="$PROJECT_ID" --limit=40 --freshness=4h \
            --format='value(timestamp,severity,protoPayload.status,protoPayload.authenticationInfo.principalEmail)' || true

      - name: Billing status
        shell: bash
        run: |
          gcloud billing projects describe "$PROJECT_ID" --format=json || true

      - name: Speech API audit log raw (last 4h)
        shell: bash
        run: |
          gcloud logging read 'logName:"speech.googleapis.com"' \
            --project="$PROJECT_ID" --limit=15 --freshness=4h --format=json \
            | jq -r '.[] | {ts:.timestamp, method:.protoPayload.methodName, principal:.protoPayload.authenticationInfo.principalEmail, status:.protoPayload.status}' 2>/dev/null || true

      - name: Traffic mapping and serving revision
        shell: bash
        run: |
          set -uo pipefail
          echo "## Full service describe (traffic + revision + image)"
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format=json \
            | jq '{traffic:.status.traffic, latestReady:.status.latestReadyRevisionName, image:.spec.template.spec.containers[0].image, sa:.spec.template.spec.serviceAccountName}'

      - name: All admin activity audit logs (last 8h)
        shell: bash
        run: |
          gcloud logging read \
            'logName:"cloudaudit.googleapis.com%2Factivity"' \
            --project="$PROJECT_ID" --limit=60 --freshness=8h \
            --format='value(timestamp,protoPayload.methodName,protoPayload.authenticationInfo.principalEmail,resource.type)' || true

      - name: CI principal speech permission baseline
        shell: bash
        run: |
          set -uo pipefail
          B64="$(base64 -w0 verification/chirp2_campaign/fixtures/en-US-5s.wav)"
          cat > /tmp/req.json <<JSON
          {"config":{"autoDecodingConfig":{},"languageCodes":["en-US"],"model":"chirp_2"},"content":"$B64"}
          JSON
          echo "CI principal direct recognize:"
          curl -s -w '\nHTTP_CODE=%{http_code}\n' -X POST \
            "https://us-central1-speech.googleapis.com/v2/projects/$PROJECT_ID/locations/us-central1/recognizers/_:recognize" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" --data @/tmp/req.json | head -20

      - name: Direct Google Speech-to-Text V2 recognize probe
        shell: bash
        run: |
          set -uo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          B64="$(base64 -w0 verification/chirp2_campaign/fixtures/en-US-5s.wav)"
          cat > /tmp/req.json <<JSON
          {"config":{"autoDecodingConfig":{},"languageCodes":["en-US"],"model":"chirp_2"},"content":"$B64"}
          JSON
          echo "### recognize response (HTTP code + body)"
          curl -s -w '\nHTTP_CODE=%{http_code}\n' \
            -X POST \
            "https://us-central1-speech.googleapis.com/v2/projects/$PROJECT_ID/locations/us-central1/recognizers/_:recognize" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/req.json | sed 's/\(content":"\).*/\1<redacted>"/'
