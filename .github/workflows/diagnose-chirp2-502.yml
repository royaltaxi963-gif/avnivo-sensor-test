name: Diagnose Chirp 2 STT 502 (read-only)

# Read-only diagnostics for the /api/transcribe-google 502. Uses the same
# keyless WIF auth as the deploy workflows. Performs no writes and no deploys.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: project-6bcf7fe6-cb55-49b7-9f4
      REGION: europe-west1
      SERVICE: avnivo-sensor-test
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Identity and service config
        shell: bash
        run: |
          set -uo pipefail
          echo "## Active principal"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo "## Cloud Run service"
          gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" \
            --format='yaml(metadata.name,spec.template.spec.serviceAccountName,status.traffic)' || true

      - name: Enabled relevant APIs
        shell: bash
        run: |
          gcloud services list --project="$PROJECT_ID" --enabled \
            --filter='config.name:(speech.googleapis.com OR run.googleapis.com)' \
            --format='value(config.name)' || true

      - name: Speech-to-Text quota (recent usage + limits)
        shell: bash
        run: |
          echo "### Service usage / quota for speech.googleapis.com"
          gcloud services list --project="$PROJECT_ID" --enabled \
            --filter='config.name:speech.googleapis.com' --format='value(config.name)' || true

      - name: Cloud Run logs for the STT route (last 2h)
        shell: bash
        run: |
          set -uo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="avnivo-sensor-test" AND (textPayload:"transcribe" OR textPayload:"Speech" OR textPayload:"502" OR jsonPayload.message:"Speech" OR jsonPayload.message:"transcribe")' \
            --project="$PROJECT_ID" --limit=50 --freshness=2h \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true

      - name: Cloud Run logs (all severity>=WARNING, last 2h)
        shell: bash
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="avnivo-sensor-test" AND severity>=WARNING' \
            --project="$PROJECT_ID" --limit=50 --freshness=2h \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true

      - name: Direct Google Speech-to-Text V2 recognize probe
        shell: bash
        run: |
          set -uo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          B64="$(base64 -w0 verification/chirp2_campaign/fixtures/en-US-5s.wav)"
          cat > /tmp/req.json <<JSON
          {"config":{"autoDecodingConfig":{},"languageCodes":["en-US"],"model":"chirp_2"},"content":"$B64"}
          JSON
          echo "### recognize response (HTTP code + body)"
          curl -s -w '\nHTTP_CODE=%{http_code}\n' \
            -X POST \
            "https://us-central1-speech.googleapis.com/v2/projects/$PROJECT_ID/locations/us-central1/recognizers/_:recognize" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/req.json | sed 's/\(content":"\).*/\1<redacted>"/'
