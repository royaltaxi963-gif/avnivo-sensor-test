name: Chirp 2 STT status timeline (read-only)

# Extracts the per-request Google Speech-to-Text V2 outcome timeline from the
# speech.googleapis.com logs so the 502 window can be bounded with evidence.
on:
  workflow_dispatch:
  push:
    paths: ['.github/timeline-request']

permissions:
  contents: read
  id-token: write

jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: project-6bcf7fe6-cb55-49b7-9f4
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Speech recognition outcome timeline (last 10h)
        shell: bash
        run: |
          echo "### Counts by Google STT status code (last 10h)"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -r '.[].jsonPayload.recognize.recognizeResponse.status.code // 0' | sort | uniq -c || true
          echo
          echo "### All NON-ZERO status entries (errors) with timestamp + code"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -r '.[] | select((.jsonPayload.recognize.recognizeResponse.status.code // 0) != 0) | [.timestamp, (.jsonPayload.recognize.recognizeResponse.status.code)] | @tsv' \
            | sort || true
          echo
          echo "### OK (code 0) count per 2-minute bucket"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -r '.[] | select((.jsonPayload.recognize.recognizeResponse.status.code // 0) == 0) | .timestamp' \
            | cut -c1-15 | sort | uniq -c || true
          echo
          echo "### First and last OK entries"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -r '.[] | select((.jsonPayload.recognize.recognizeResponse.status.code // 0) == 0) | .timestamp' \
            | sort | sed -n '1p;$p' || true
