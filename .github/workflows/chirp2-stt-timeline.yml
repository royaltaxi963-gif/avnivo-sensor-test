name: Chirp 2 STT status timeline (read-only)

# Extracts the per-request Google Speech-to-Text V2 outcome timeline from the
# speech.googleapis.com logs so the 502 window can be bounded with evidence.
on:
  workflow_dispatch:
  push:
    paths: ['.github/timeline-request']

permissions:
  contents: read
  id-token: write

jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: project-6bcf7fe6-cb55-49b7-9f4
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Speech recognition outcome timeline (last 10h)
        shell: bash
        run: |
          echo "### Non-zero status: timestamp, code, message"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -r '.[] | select((.jsonPayload.recognize.recognizeResponse.status.code // 0) != 0) | [.timestamp, (.jsonPayload.recognize.recognizeResponse.status.code), (.jsonPayload.recognize.recognizeResponse.status.message // "")] | @tsv' \
            | sort || true
          echo
          echo "### Code 3 request config sample (first + last)"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -c '[.[] | select((.jsonPayload.recognize.recognizeResponse.status.code // 0) == 3)] | sort_by(.timestamp) | (.[0], .[-1]) | {ts:.timestamp, msg:.jsonPayload.recognize.recognizeResponse.status.message, reqConfig:.jsonPayload.recognize.recognizeRequest.config}' 2>/dev/null || true
          echo
          echo "### Code 0 request config sample (last OK)"
          gcloud logging read 'logName:"speech.googleapis.com%2Fcloud_speech_recognition_stream"' \
            --project="$PROJECT_ID" --limit=1000 --freshness=10h --format=json \
            | jq -c '[.[] | select((.jsonPayload.recognize.recognizeResponse.status.code // 0) == 0)] | sort_by(.timestamp) | .[-1] | {ts:.timestamp, reqConfig:.jsonPayload.recognize.recognizeRequest.config}' 2>/dev/null || true
