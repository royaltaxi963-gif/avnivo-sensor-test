name: AVNIVO private GCS model audit
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792624108019/locations/global/workloadIdentityPools/avnivo-github-pool/providers/avnivo-github
          service_account: avnivo-gcs-auditor@project-6bcf7fe6-cb55-49b7-9f4.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'google-cloud-storage>=2.18,<4'
      - name: Audit GCS objects without publishing private paths
        env:
          BUCKET: avnivo-offline-models-792624108019
        run: |
          python - <<'PY'
          import hashlib, json, os, sys
          from google.cloud import storage
          bucket=os.environ['BUCKET']
          prefixes=['multilingual-stt/','multilingual-translation/','stt-uzbek/','tts/']
          client=storage.Client()
          report={'bucket':bucket,'prefixes':{},'verified_objects':0,'verified_bytes':0}
          for prefix in prefixes:
              objects=0
              total=0
              for blob in client.list_blobs(bucket,prefix=prefix):
                  if blob.name.endswith('/'): continue
                  if blob.size is None: raise RuntimeError('Missing object size')
                  sha=hashlib.sha256()
                  with blob.open('rb',chunk_size=4*1024*1024) as stream:
                      while True:
                          part=stream.read(4*1024*1024)
                          if not part: break
                          sha.update(part)
                  # Do not print or upload signed URLs, object names, or model bytes.
                  objects+=1
                  total+=blob.size
                  if len(sha.digest())!=32: raise RuntimeError('Digest failed')
              report['prefixes'][prefix]={'objects':objects,'bytes':total}
              report['verified_objects']+=objects
              report['verified_bytes']+=total
              print(prefix,'objects:',objects,'bytes:',total)
          with open(os.environ['RUNNER_TEMP']+'/avnivo-gcs-audit-summary.json','w') as f:
              json.dump(report,f,indent=2)
          if report['verified_objects']==0: sys.exit('No objects found in audited prefixes')
          print('Verified objects:',report['verified_objects'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avnivo-gcs-audit-summary
          path: ${{ runner.temp }}/avnivo-gcs-audit-summary.json
          retention-days: 1
          if-no-files-found: error
