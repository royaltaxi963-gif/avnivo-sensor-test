name: Deploy offline model API to isolated Cloud Run staging
on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: 'Type DEPLOY-STAGING to authorize a potentially billable isolated deployment'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy-staging:
    if: ${{ inputs.confirm_staging_deploy == 'DEPLOY-STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test before deploy (no paid API calls)
        run: |
          python -m pip install -r translator-api/requirements.txt pytest
          (cd translator-api && python -m pytest test_offline_models.py -q)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify staging target and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=project-6bcf7fe6-cb55-49b7-9f4
          REGION=europe-west1
          SERVICE=avnivo-offline-model-api-staging
          RUNTIME_SA=792624108019-compute@developer.gserviceaccount.com
          gcloud projects describe "$PROJECT" --format='value(projectId)'
          gcloud iam service-accounts describe "$RUNTIME_SA" --project="$PROJECT" --format='value(email)'
          gcloud run services list --project="$PROJECT" --region="$REGION" --format='value(metadata.name)' | tee /tmp/avnivo-services.txt
          if grep -Fxq "$SERVICE" /tmp/avnivo-services.txt; then
            echo "::error::Staging service already exists; refusing to overwrite an existing service"
            exit 1
          fi
          echo "Isolated staging target verified. Deployment authorization is not established by these read-only checks."
      - name: Deploy new isolated service (never replace production)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=project-6bcf7fe6-cb55-49b7-9f4
          SERVICE=avnivo-offline-model-api-staging
          REGION=europe-west1
          RUNTIME_SA=792624108019-compute@developer.gserviceaccount.com
          gcloud run deploy "$SERVICE" \
            --source=translator-api \
            --project="$PROJECT" \
            --region="$REGION" \
            --service-account="$RUNTIME_SA" \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60 \
            --set-env-vars="AVNIVO_MODEL_BUCKET=avnivo-offline-models-792624108019,AVNIVO_SIGNER_SERVICE_ACCOUNT=$RUNTIME_SA" \
            --quiet
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          test -n "$URL"
          echo "Private staging service created: $SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: Signed model downloads require runtime service-account token-creation and GCS object permissions; verify separately." >> "$GITHUB_STEP_SUMMARY"
          TOKEN="$(gcloud auth print-identity-token --audiences="$URL")"
          HTTP="$(curl -sS -o /tmp/health.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL/health")"
          test "$HTTP" = 200
          cat /tmp/health.json
          echo "Authenticated staging health: 200" >> "$GITHUB_STEP_SUMMARY"
