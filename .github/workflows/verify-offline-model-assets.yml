name: Verify offline model assets and SHA256
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify stored assets and generate integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          python3 - <<'PY'
          import json,subprocess,hashlib,os,re
          bucket='gs://avnivo-offline-models-792624108019/'
          # Only model files from approved fixed prefixes; no user-supplied object names.
          models={'navoiy-tts':'tts/uzbek/navoiy/','mms-tts':'tts/mms/rus/'}
          for model,prefix in models.items():
              r=subprocess.run(['gcloud','storage','cat',bucket+prefix+'avnivo-manifest.json'],capture_output=True,text=True,check=True)
              manifest=json.loads(r.stdout)
              verified=[]
              for item in manifest.get('files',[]):
                  rel=item.get('path','')
                  size=item.get('bytes')
                  status=item.get('status')
                  if not isinstance(rel,str) or not rel or rel.startswith('/') or '..' in rel.split('/') or not re.fullmatch(r'[A-Za-z0-9_./-]+',rel):
                      print('REJECT unsafe path',model);continue
                  if not isinstance(size,int) or size<0 or size>3_000_000_000:
                      print('REJECT size',model,rel);continue
                  if status not in ('complete','verified','downloaded','ok','uploaded','present','existing_size_checked',True):
                      print('REVIEW status',model,rel,str(status)[:40]);continue
                  obj=bucket+prefix+rel
                  print('Verifying',model,rel,'bytes',size,flush=True)
                  proc=subprocess.Popen(['gcloud','storage','cat',obj],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  digest=hashlib.sha256();total=0
                  while True:
                      block=proc.stdout.read(1024*1024)
                      if not block:break
                      total+=len(block);digest.update(block)
                      if total>size:break
                  proc.stdout.close()
                  err=proc.stderr.read(500);rc=proc.wait()
                  if rc or total!=size:
                      print('FAILED integrity',model,rel,'expected',size,'got',total,'error',err.decode(errors='replace')[:160]);continue
                  verified.append({'name':rel,'object':prefix+rel,'bytes':size,'sha256':digest.hexdigest()})
              with open('verified/'+model+'.json','w') as f:json.dump({'model_id':model,'files':verified},f,indent=2)
              print(model,'verified',len(verified),'of',len(manifest.get('files',[])),flush=True)
              if len(verified) != len(manifest.get('files',[])):raise SystemExit('Incomplete verification for '+model)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-verified-sha256-manifests
          path: verified/*.json
          retention-days: 7
      - name: Publish reviewed integrity data to backend directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p translator-api/verified_models
          cp verified/navoiy-tts.json verified/mms-tts.json translator-api/verified_models/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translator-api/verified_models/
          if git diff --cached --quiet; then
            echo "Verified manifests already current"
          else
            git commit -m "Publish SHA256-verified offline model manifests"
            git push origin HEAD:main
          fi
