name: Translator API offline tests
on:
  push:
    paths:
      - 'translator-api/**'
      - '.github/workflows/translator-api-tests.yml'
  pull_request:
    paths:
      - 'translator-api/**'
      - '.github/workflows/translator-api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: translator-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r translator-api/requirements.txt
          python -m pip install 'pytest>=8,<9'
      - name: Compile Python
        run: python -m compileall -q translator-api
      - name: Run offline tests (no paid API calls)
        run: python -m pytest -q translator-api/test_translation_llm.py
