name: Repair offline model ticket signer (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply IAM and Cloud Run signer configuration (false = diagnostics only)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect and optionally configure signed model delivery
        shell: bash
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          PROJECT=project-6bcf7fe6-cb55-49b7-9f4
          SERVICE=avnivo-translation-test
          REGION=europe-west1
          BUCKET=avnivo-offline-models-792624108019
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" >/dev/null
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
          [[ "$URL" == *"avnivo-translation-test"* ]] || { echo "::error::Unexpected target service URL: $URL"; exit 1; }
          echo "Target URL: $URL"
          SA="$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(spec.template.spec.serviceAccountName)')"
          if [[ -z "$SA" ]]; then
            NUMBER="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')"
            SA="${NUMBER}-compute@developer.gserviceaccount.com"
          fi
          [[ "$SA" == *@*.iam.gserviceaccount.com ]] || { echo "::error::Unexpected service identity"; exit 1; }
          echo "Cloud Run service: $SERVICE; runtime identity: $SA"
          gcloud storage buckets describe "gs://$BUCKET" --project "$PROJECT" >/dev/null
          for FILE in stt-uzbek/model.int8.onnx stt-uzbek/tokens.txt; do
            gcloud storage objects describe "gs://$BUCKET/$FILE" --project "$PROJECT" --format='value(name,size)' || { echo "::error::Missing model object: $FILE"; exit 1; }
          done
          echo "Required bucket role: roles/storage.objectViewer"
          echo "Required signer permission: roles/iam.serviceAccountTokenCreator on runtime identity"
          if [[ "$APPLY" != true ]]; then
            echo "Diagnostics only. No IAM or Cloud Run changes made."
            exit 0
          fi
          gcloud storage buckets add-iam-policy-binding "gs://$BUCKET" --member="serviceAccount:$SA" --role="roles/storage.objectViewer" --project="$PROJECT"
          gcloud iam service-accounts add-iam-policy-binding "$SA" --project="$PROJECT" --member="serviceAccount:$SA" --role="roles/iam.serviceAccountTokenCreator"
          gcloud run services update "$SERVICE" --region "$REGION" --project "$PROJECT" --update-env-vars="AVNIVO_SIGNER_SERVICE_ACCOUNT=$SA,AVNIVO_MODEL_BUCKET=$BUCKET"
          echo "IAM and signer env applied. Confirm deployed backend revision and ticket response separately."
          STATUS="$(curl -sS -o /tmp/model-ticket-response.json -w '%{http_code}' "$URL/api/offline-models/uzbek-stt/download-ticket" || true)"
          echo "Model ticket HTTP status: $STATUS"
          if [[ "$STATUS" != 200 ]]; then
            echo "::error::Live model ticket endpoint is not healthy; inspect Cloud Run revision and service logs"
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("/tmp/model-ticket-response.json")); assert d.get("model_id")=="uzbek-stt" and len(d.get("files",[]))==2; print("Verified two model ticket entries")'
