name: Offline model delivery tests and Cloud Run build
on:
  workflow_dispatch:
  push:
    paths:
      - 'translator-api/**'
      - '.github/workflows/offline-model-api-check.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install -r translator-api/requirements.txt
          python -m pip install 'pytest>=8,<9'
      - name: Test offline model API
        run: python -m pytest translator-api/test_offline_models.py -q
      - name: Compile backend
        run: python -m compileall -q translator-api
      - name: Build production container without deployment
        run: docker build -t avnivo-offline-model-api:check ./translator-api
