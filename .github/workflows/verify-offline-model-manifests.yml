name: Verify offline model manifests (SHA-256)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-offline-model-manifests.yml'
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compute SHA-256 manifests for the new offline models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, subprocess, hashlib, re
          BUCKET = 'gs://avnivo-offline-models-792624108019/'
          MODELS = {
              'whisper-small-q8': 'multilingual-stt/whisper-small-q8_0/',
              'whisper-large-v3-turbo': 'multilingual-stt/whisper-large-v3-turbo-q5_0/',
              'nllb-200-600m-int8': 'multilingual-translation/nllb-200-600m-int8/',
          }
          for model, prefix in MODELS.items():
              listing = subprocess.run(
                  ['gcloud', 'storage', 'ls', '-l', BUCKET + prefix + '**'],
                  capture_output=True, text=True, check=True).stdout
              files = []
              for line in listing.splitlines():
                  parts = line.split()
                  if len(parts) < 3 or not parts[-1].startswith(BUCKET):
                      continue
                  size = int(parts[0])
                  obj = parts[-1]
                  rel = obj[len(BUCKET):]
                  if rel == prefix or rel.endswith('/'):
                      continue
                  name = rel[len(prefix):]
                  if name == 'avnivo-manifest.json':
                      continue
                  if not re.fullmatch(r'[A-Za-z0-9_./-]+', name) or '..' in name.split('/'):
                      raise SystemExit('unsafe object name ' + name)
                  proc = subprocess.Popen(['gcloud', 'storage', 'cat', obj],
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  digest = hashlib.sha256()
                  total = 0
                  while True:
                      block = proc.stdout.read(1024 * 1024)
                      if not block:
                          break
                      digest.update(block)
                      total += len(block)
                  proc.stdout.close()
                  rc = proc.wait()
                  if rc or total != size:
                      raise SystemExit('hash failed for ' + obj)
                  files.append({'name': name, 'object': rel, 'bytes': size, 'sha256': digest.hexdigest()})
                  print(model, name, size, digest.hexdigest(), flush=True)
              files.sort(key=lambda f: f['name'])
              with open('out/' + model + '.json', 'w', encoding='utf-8') as handle:
                  json.dump({'model_id': model, 'files': files}, handle, indent=2)
              print('WROTE', model, len(files), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: offline-model-manifests
          path: out/*.json
          retention-days: 7
