name: AVNIVO integrated Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/avnivo-integrated-android.yml'
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/avnivo-integrated-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35'
          test -d "$ANDROID_HOME/build-tools/35.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'
      - name: Fetch native Sherpa ONNX runtime
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          test -s app/libs/sherpa-onnx-2.0.1.aar
      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avnivo-unit-test-reports
          path: android-app/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
      - name: Build integrated APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: avnivo-translator-integrated-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: avnivo-translator-androidtest-apk
          path: android-app/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
  emulator-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: avnivo-translator-integrated-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: avnivo-translator-androidtest-apk
          path: androidtest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r apk/app-debug.apk
            adb shell pm list packages | grep -q com.avnivo.translator || { echo NOT_INSTALLED; exit 1; }
            adb shell am start -W -n com.avnivo.translator/.MainActivity
            sleep 20
            adb logcat -d > logcat.txt
            adb shell dumpsys window | grep -i mCurrentFocus || true
            PID=$(adb shell pidof com.avnivo.translator | tr -d '\r'); echo "app pid: $PID"; [ -n "$PID" ] || { echo APP_NOT_RUNNING; exit 1; }
            grep -iE "FATAL EXCEPTION" logcat.txt && { echo FATAL_IN_LOGCAT; exit 1; } || true
            adb install -r androidtest/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.avnivo.translator.OfflineEngineInstrumentedTest com.avnivo.translator.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "OK (" instrument.txt || { echo INSTRUMENTED_TESTS_FAILED; exit 1; }
            adb shell am instrument -w -e class com.avnivo.translator.OfflineRealInferenceTest -e avnivoRealInference true com.avnivo.translator.test/androidx.test.runner.AndroidJUnitRunner | tee instrument_real.txt
            grep -q "OK (" instrument_real.txt || { echo REAL_INFERENCE_FAILED; exit 1; }
            echo EMULATOR_SMOKE_OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avnivo-emulator-logcat
          path: logcat.txt
          if-no-files-found: warn
