name: Publish Silero TTS model to the private offline bucket

# The Silero Uzbek voice is MIT-licensed, so it can be redistributed, but 92 MB of weights must
# never enter git. Instead CI downloads the authoritative upstream package, exports the TorchScript
# Lite graph that the Android runtime can actually load, proves the export reproduces the pinned
# digest, and only then uploads it to the private bucket the app already downloads from.
#
# The export is deterministic: the same torch version, the same input, and the same output file
# name produce a byte-identical archive. If that ever stops being true the step fails instead of
# silently publishing a different artifact than the one the app has pinned.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the verified artifact to the private bucket (leave off to only verify)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://models.silero.ai/models/tts/ru/v5_cis_base.pt
      UPSTREAM_SHA256: ba41b18f6a707ad93605a162998865e7c087153d2e010a26dd02229dab0e672a
      UPSTREAM_BYTES: '91680514'
      ARTIFACT_SHA256: 333128fb6c7476e7fceec562f3f54980cbb6a88bbe59ff4a8e67e6cddad7a861
      ARTIFACT_BYTES: '91988758'
      ARTIFACT_NAME: silero_v21.ptl
      BUCKET: avnivo-offline-models-792624108019
      OBJECT: tts/uzbek/silero/silero_v21.ptl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # torch 2.1.0 is the version whose Lite interpreter reads bytecode v8, which is what
      # org.pytorch:pytorch_android_lite:2.1.0 can load. Newer torch emits v10 and would not load.
      - name: Install the pinned export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('torch', torch.__version__)"

      - name: Download the authoritative upstream package
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --max-time 900 -o v5_cis_base.pt "$UPSTREAM_URL"
          ACTUAL_BYTES=$(stat -c %s v5_cis_base.pt)
          ACTUAL_SHA=$(sha256sum v5_cis_base.pt | cut -d' ' -f1)
          echo "upstream bytes=$ACTUAL_BYTES sha256=$ACTUAL_SHA"
          test "$ACTUAL_BYTES" = "$UPSTREAM_BYTES" || { echo "::error::upstream size changed"; exit 1; }
          test "$ACTUAL_SHA" = "$UPSTREAM_SHA256" || { echo "::error::upstream digest changed"; exit 1; }

      - name: Export the TorchScript Lite graph
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch, warnings
          warnings.filterwarnings("ignore")

          imp = torch.package.PackageImporter("v5_cis_base.pt")
          package = imp.load_pickle("tts_models", "model")
          model = package.packages[0].models[0].eval()

          # uzb_saida (id 46) is the only Uzbek speaker in the MIT v5_cis_base package.
          ids = torch.tensor([[2, 30, 13, 24, 27, 25, 1]], dtype=torch.long)
          speaker = torch.tensor([46], dtype=torch.long)
          traced = torch.jit.trace(model, (ids, speaker), strict=False)
          traced._save_for_lite_interpreter("silero_v21.ptl")
          print("exported silero_v21.ptl")
          PY

      - name: Prove the export reproduces the pinned artifact
        run: |
          set -euo pipefail
          ACTUAL_BYTES=$(stat -c %s "$ARTIFACT_NAME")
          ACTUAL_SHA=$(sha256sum "$ARTIFACT_NAME" | cut -d' ' -f1)
          echo "artifact bytes=$ACTUAL_BYTES sha256=$ACTUAL_SHA"
          test "$ACTUAL_BYTES" = "$ARTIFACT_BYTES" || { echo "::error::export is not byte-identical (size)"; exit 1; }
          test "$ACTUAL_SHA" = "$ARTIFACT_SHA256" || { echo "::error::export is not byte-identical (digest)"; exit 1; }
          python - <<'PY'
          import pickle, zipfile
          z = zipfile.ZipFile("silero_v21.ptl")
          version = pickle.loads(z.read("silero_v21/bytecode.pkl"))[0]
          print("bytecode version:", version)
          assert version == 8, f"pytorch_android_lite 2.1.0 needs bytecode 8, got {version}"
          PY

      - name: Confirm the graph really synthesizes Uzbek
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch, warnings
          warnings.filterwarnings("ignore")
          m = torch.jit.load("silero_v21.ptl")
          ids = torch.tensor([[2, 30, 13, 24, 27, 25, 1]], dtype=torch.long)  # "salom"
          with torch.no_grad():
              audio = m(ids, torch.tensor([46], dtype=torch.long))[0]
          samples = audio.shape[-1]
          print(f"samples={samples} seconds={samples / 48000:.3f} peak={float(audio.abs().max()):.3f}")
          assert samples > 4800, "too little audio"
          assert float(audio.abs().max()) > 0.01, "model returned silence"
          PY

      - name: Authenticate with Google Cloud using WIF
        if: ${{ inputs.publish }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        if: ${{ inputs.publish }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to the private model bucket
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          gcloud storage cp "$ARTIFACT_NAME" "gs://${BUCKET}/${OBJECT}" \
            --content-type=application/octet-stream
          gcloud storage objects describe "gs://${BUCKET}/${OBJECT}" \
            --format="value(name,size,md5_hash)"

      - uses: actions/upload-artifact@v4
        with:
          name: silero-tts-ptl
          path: silero_v21.ptl
          retention-days: 7
