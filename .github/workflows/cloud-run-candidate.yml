name: Cloud Run candidate (manual, zero traffic)

# Builds the translator-api image from a reviewed ref, pushes it to Artifact
# Registry under an explicit unique tag, and deploys a *candidate* Cloud Run
# revision with no traffic. Traffic is never shifted here; promotion is a
# separate, deliberate step. An explicit --image (rather than --source) is used
# so a stale build cache can never serve an old image.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed branch or commit SHA to build'
        required: true
        type: string
      image_tag:
        description: 'Unique image tag (e.g. the commit SHA)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: avnivo-cloud-run-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloud-run-candidate
    env:
      PROJECT_ID: project-6bcf7fe6-cb55-49b7-9f4
      REGION: europe-west1
      SERVICE: avnivo-sensor-test
      REPO: avnivo-translator-api
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Authenticate with Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "$REPO" \
            --project="$PROJECT_ID" --location="$REGION" \
          || gcloud artifacts repositories create "$REPO" \
            --project="$PROJECT_ID" --location="$REGION" \
            --repository-format=docker \
            --description="AVNIVO translator-api images"

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/app:${{ inputs.image_tag }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --tag "$IMAGE" ./translator-api

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy candidate revision without traffic
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --no-traffic \
            --tag=candidate \
            --quiet

      - name: Print revisions and candidate URL
        run: |
          gcloud run revisions list --service="$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --limit=5
          gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='value(status.traffic)' || true
          echo "Candidate URL: $(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='value(status.address.url)')"
